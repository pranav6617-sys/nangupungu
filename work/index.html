<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Work Log</title>
<meta name="theme-color" content="#16181B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F1F2EF" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: the coffee-log pattern. Two big tap tiles, then "didn't work" and "after hours" bars under them, a month-grouped log below, bottom sheets for edits and copying. */
:root {
  color-scheme: dark;
  --bg: #16181b;
  --surface: #1f2226;
  --line: #2a2e33;
  --fg: #e9ebee;
  --muted: #868c95;
  --wfh-tile: #243140;
  --wfh-ink: #a9c4dd;
  --office-tile: #372d22;
  --office-ink: #ddbd95;
  --off-tile: #263029;
  --off-ink: #b0d0b3;
  --after-tile: #2f2b45;
  --after-ink: #c4bcf0;
  --start: #7fd8a0;
  --end: #ff9b90;
  --danger: #e8968a;
  --scrim: rgba(5, 6, 8, 0.62);
  --toast-bg: #2a2e34;
  --toast-fg: #e9ebee;
  --toast-accent: #a9c4dd;
  --font-ui: "Lexend", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f1f2ef;
    --surface: #fafaf8;
    --line: #dee1dd;
    --fg: #2e3336;
    --muted: #646c70;
    --wfh-tile: #d5e2ea;
    --wfh-ink: #3b596d;
    --office-tile: #ecddc7;
    --office-ink: #7e5430;
    --off-tile: #dbe6d8;
    --off-ink: #456a4b;
    --after-tile: #e3dff2;
    --after-ink: #54498c;
    --start: #12703a;
    --end: #b3261e;
    --danger: #a0443a;
    --scrim: rgba(28, 34, 38, 0.34);
    --toast-bg: #2e3336;
    --toast-fg: #f1f2ef;
    --toast-accent: #a9c8dc;
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }

.app {
  max-width: 520px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 28px;
}

:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  position: relative;
  aspect-ratio: 5 / 6;
  max-width: 100%;
  border: 0;
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.12s ease, opacity 0.2s ease;
}
.tile.wfh { background: var(--wfh-tile); color: var(--wfh-ink); }
.tile.office { background: var(--office-tile); color: var(--office-ink); }
.tile svg { width: 56px; height: 56px; }
.tile-label { font-family: var(--font-data); font-size: 26px; font-weight: 500; }
.tile-text { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.tile.off, .tile.after {
  grid-column: 1 / -1;
  aspect-ratio: auto;
  flex-direction: row;
  justify-content: flex-start;
  gap: 14px;
  padding-block: 20px;
  padding-inline: 24px 18px;
}
.tile.off { background: var(--off-tile); color: var(--off-ink); }
.tile.after { background: var(--after-tile); color: var(--after-ink); }
.tile.off svg, .tile.after svg { width: 30px; height: 30px; flex: none; }
.tile.off .tile-label, .tile.after .tile-label { font-size: 22px; }
.tile.after .tile-text { align-items: flex-start; gap: 3px; }
.tile:active { transform: scale(0.97); }
.tile.is-closed { opacity: 0.38; }
.tile.is-closed:active { transform: none; }
.tile .mark {
  position: absolute;
  top: 14px;
  inset-inline: 0;
  margin-inline: auto;
  width: max-content;
  padding: 3px 10px;
  border: 1.5px solid currentColor;
  border-radius: 999px;
  font-family: var(--font-data);
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.tile.is-today { box-shadow: inset 0 0 0 2px currentColor; }
.tile.is-today .mark { opacity: 1; }
.tile.off .mark, .tile.after .mark { position: static; margin-inline: auto 0; flex: none; }
.tile.flash { animation: flash 0.6s ease-out; }
@keyframes flash {
  from { box-shadow: inset 0 0 0 2px currentColor, 0 0 0 0 currentColor; }
  to { box-shadow: inset 0 0 0 2px currentColor, 0 0 0 14px transparent; }
}

/* The times: green for the start, red for the end. The arrow and the order carry the meaning too. */
.when {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 8px;
  min-height: 1.4em;
  font-family: var(--font-data);
  font-size: 16px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
}
/* On the two big tiles the times sit along the bottom, so the icon and name stay where they always were. */
.tile.wfh .when, .tile.office .when { position: absolute; left: 8px; right: 8px; bottom: 16px; justify-content: center; }
.when .hint { font-size: 14px; opacity: 0.75; }
.when .more { font-size: 13px; opacity: 0.75; }
.times {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-data);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.times b { font-weight: 600; }
.times .s { color: var(--start); }
.times .e { color: var(--end); }
.times .arrow { font-style: normal; opacity: 0.6; }
.times .gap { font-style: normal; font-size: 13px; opacity: 0.8; }

/* Log */
.loghead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.loghead h2 { margin: 0; font-size: 22px; font-weight: 600; }
.sheet-sync { margin-right: auto; font-family: var(--font-data); font-size: 14px; color: var(--muted); }
.sheet-sync::before { content: "· "; }
.sheet-sync.warn { color: var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-data); font-size: 13.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }

.dot { display: inline-block; flex: none; width: 11px; height: 11px; border-radius: 50%; }
.dot.ring { border: 2.5px solid var(--wfh-ink); }
.dot.fill { background: var(--office-ink); }
.dot.dash { width: 13px; height: 3px; border-radius: 2px; background: var(--off-ink); }
.dot.diamond { width: 9px; height: 9px; border-radius: 2px; background: var(--after-ink); transform: rotate(45deg); }
.wfh .dot { border: 2.5px solid currentColor; }
.office .dot { background: currentColor; }
.off .dot { width: 13px; height: 3px; border-radius: 2px; background: currentColor; }
.after .dot { width: 9px; height: 9px; border-radius: 2px; background: currentColor; transform: rotate(45deg); }

.status { margin: 18px 0 0; max-width: 44ch; color: var(--muted); font-size: 15px; line-height: 1.55; }

.month {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px 12px;
  padding-block: 20px 4px;
  font-family: var(--font-data);
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.month .counts { font-size: 12.5px; letter-spacing: 0.04em; text-transform: none; }
.month .part { white-space: nowrap; }

.row {
  width: 100%;
  display: grid;
  grid-template-columns: 7.5rem minmax(0, 1fr) 20px;
  align-items: center;
  gap: 12px;
  padding-block: 14px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.row:focus-visible { outline-offset: -2px; border-radius: 10px; }
.row .d { font-size: 17px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.today .d { color: var(--fg); }
.row.more .d { visibility: hidden; }
.row .mid { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-width: 0; }
.row .times { font-size: 15px; }
.row .times .arrow, .row .times .gap { color: var(--muted); opacity: 1; }
.row .chev { width: 18px; height: 18px; color: var(--muted); opacity: 0.55; }
.row:hover .chev, .row:focus-visible .chev { opacity: 1; }

.pill {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 15px 7px 12px;
  border-radius: 999px;
  font-family: var(--font-data);
  font-size: 15px;
  font-weight: 500;
}
.pill.wfh { background: var(--wfh-tile); color: var(--wfh-ink); }
.pill.office { background: var(--office-tile); color: var(--office-ink); }
.pill.off { background: var(--off-tile); color: var(--off-ink); }
.pill.after { background: var(--after-tile); color: var(--after-ink); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 8px; }
.link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 2px;
  border: 0;
  background: none;
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}
.link svg { width: 16px; height: 16px; }
.link:hover:not(:disabled) { color: var(--fg); }
.link:disabled { opacity: 0.45; cursor: default; }

/* Sheets */
.sheet {
  border: 0;
  padding: 0;
  margin: auto auto 0;
  width: 100%;
  max-width: 520px;
  max-height: 100%;
  border-radius: 26px 26px 0 0;
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
}
.sheet::backdrop { background: var(--scrim); }
.sheet[open] { animation: rise 0.22s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-inline: 20px;
  padding-block: 22px calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheet h3 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; outline: none; }
.sheet .sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; }

.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > span {
  font-family: var(--font-data);
  font-size: 12.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.field select, .field input {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 50px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px var(--font-ui);
}
.field input {
  font: 600 18px var(--font-data);
  font-variant-numeric: tabular-nums;
}
.field input.s-in { color: var(--start); }
.field input.e-in { color: var(--end); }
.field input.bad { border-color: var(--danger); }
.field input::placeholder { color: var(--muted); font-weight: 400; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 8px;
  border: 2px solid transparent;
  border-radius: 18px;
  font-family: var(--font-data);
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  opacity: 0.55;
  touch-action: manipulation;
}
.seg-btn.wfh { background: var(--wfh-tile); color: var(--wfh-ink); }
.seg-btn.office { background: var(--office-tile); color: var(--office-ink); }
.seg-btn.off { background: var(--off-tile); color: var(--off-ink); }
.seg-btn.after { background: var(--after-tile); color: var(--after-ink); }
.seg-btn[aria-checked="true"] { opacity: 1; border-color: currentColor; }

.times-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfield { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.nudge { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.nudge button {
  height: 40px;
  min-width: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: none;
  color: var(--fg);
  font: 500 13px var(--font-data);
  cursor: pointer;
  touch-action: manipulation;
}
.nudge button:active:not(:disabled) { transform: scale(0.95); background: var(--line); }
.nudge button:disabled { opacity: 0.35; cursor: default; }

.note { margin: 0; min-height: 1.4em; color: var(--office-ink); font-size: 14px; }
.note.warn { color: var(--danger); }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.btn {
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: none;
  color: var(--fg);
  font: 500 15px var(--font-ui);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.danger { padding-inline: 4px; border-color: transparent; color: var(--danger); }

.sheet textarea {
  width: 100%;
  min-width: 0;
  resize: vertical;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.5 var(--font-data);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 12px 12px 12px 18px;
  border-radius: 16px;
  background: var(--toast-bg);
  color: var(--toast-fg);
  font-size: 15px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 140%);
  transition: transform 0.22s ease, opacity 0.22s ease;
}
.toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.toast button {
  padding: 6px 8px;
  border: 0;
  background: none;
  color: var(--toast-accent);
  font: 600 15px var(--font-ui);
  cursor: pointer;
}

/* Small phones: a little tighter so nothing overlaps or wraps awkwardly */
@media (max-width: 360px) {
  .tile { gap: 10px; }
  .tile svg { width: 44px; height: 44px; }
  .tile-label { font-size: 22px; }
  .tile.off, .tile.after { gap: 12px; padding-inline: 18px 14px; }
  .tile.off svg, .tile.after svg { width: 26px; height: 26px; }
  .tile.off .tile-label, .tile.after .tile-label { font-size: 18px; }
  .tile.off .mark, .tile.after .mark { padding: 2px 8px; font-size: 10.5px; }
  .when { font-size: 14px; }
  .row { grid-template-columns: 6rem minmax(0, 1fr) 16px; gap: 8px; }
  .row .d { font-size: 15px; }
  .pill { gap: 7px; padding: 6px 12px 6px 10px; font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app">
  <div class="tiles" role="group" aria-label="Log today">
    <button type="button" class="tile wfh" data-place="wfh" aria-label="Start working from home today">
      <span class="mark" aria-hidden="true">today</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 7.2 4h9.6l4.2 6.5Z"/>
        <path d="M5 10.5V20h14v-9.5"/>
        <path d="M10 20v-5h4v5"/>
      </svg>
      <span class="tile-text"><span class="tile-label">wfh</span><span class="when" aria-hidden="true"></span></span>
    </button>
    <button type="button" class="tile office" data-place="office" aria-label="Start an office day today">
      <span class="mark" aria-hidden="true">today</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="3" width="14" height="18" rx="1.5"/>
        <path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15"/>
        <path d="M10.5 21v-2.5h3V21"/>
      </svg>
      <span class="tile-text"><span class="tile-label">office</span><span class="when" aria-hidden="true"></span></span>
    </button>
    <button type="button" class="tile off" data-place="off" aria-label="Log today as a day you didn't work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M10 9v6M14 9v6"/>
      </svg>
      <span class="tile-label">didn't work</span>
      <span class="mark" aria-hidden="true">today</span>
    </button>
    <button type="button" class="tile after" data-place="after" aria-label="Start an after hours session">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span class="tile-text"><span class="tile-label">after hours</span><span class="when" aria-hidden="true"></span></span>
      <span class="mark" aria-hidden="true">today</span>
    </button>
  </div>

  <section aria-labelledby="logTitle">
    <div class="loghead">
      <h2 id="logTitle">work log</h2>
      <span class="sheet-sync" id="sheet-sync" hidden></span>
      <div class="legend" aria-hidden="true">
        <span><i class="dot ring"></i>wfh</span>
        <span><i class="dot fill"></i>office</span>
        <span><i class="dot dash"></i>didn't work</span>
        <span><i class="dot diamond"></i>after hours</span>
      </div>
    </div>
    <p class="status" id="status" hidden></p>
    <div id="list"></div>
    <div class="foot">
      <button type="button" class="link" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add a past day
      </button>
      <button type="button" class="link" id="copyBtn" aria-label="Copy CSV of the whole log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        copy csv
      </button>
    </div>
  </section>
</main>

<dialog class="sheet" id="editSheet" aria-labelledby="editTitle">
  <form class="sheet-body" id="editForm" novalidate>
    <h3 id="editTitle" tabindex="-1" autofocus>Edit day</h3>
    <label class="field" for="editDay">
      <span>Day</span>
      <select id="editDay"></select>
    </label>
    <div class="seg" role="radiogroup" aria-label="Kind of entry">
      <button type="button" class="seg-btn wfh" data-place="wfh" role="radio" aria-checked="false"><i class="dot"></i>wfh</button>
      <button type="button" class="seg-btn office" data-place="office" role="radio" aria-checked="false"><i class="dot"></i>office</button>
      <button type="button" class="seg-btn off" data-place="off" role="radio" aria-checked="false"><i class="dot"></i>didn't work</button>
      <button type="button" class="seg-btn after" data-place="after" role="radio" aria-checked="false"><i class="dot"></i>after hours</button>
    </div>
    <div class="times-grid" id="timeBox">
      <div class="tfield">
        <label class="field" for="editStart">
          <span>Start, 24h</span>
          <input type="text" id="editStart" class="s-in" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" maxlength="8" placeholder="--:--">
        </label>
        <div class="nudge" role="group" aria-label="Move the start time by minutes">
          <button type="button" data-for="start" data-min="-15" aria-label="15 minutes earlier">−15</button>
          <button type="button" data-for="start" data-min="-5" aria-label="5 minutes earlier">−5</button>
          <button type="button" data-for="start" data-min="5" aria-label="5 minutes later">+5</button>
          <button type="button" data-for="start" data-min="15" aria-label="15 minutes later">+15</button>
        </div>
      </div>
      <div class="tfield">
        <label class="field" for="editEnd">
          <span>End, 24h</span>
          <input type="text" id="editEnd" class="e-in" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="8" placeholder="--:--">
        </label>
        <div class="nudge" role="group" aria-label="Move the end time by minutes">
          <button type="button" data-for="end" data-min="-15" aria-label="15 minutes earlier">−15</button>
          <button type="button" data-for="end" data-min="-5" aria-label="5 minutes earlier">−5</button>
          <button type="button" data-for="end" data-min="5" aria-label="5 minutes later">+5</button>
          <button type="button" data-for="end" data-min="15" aria-label="15 minutes later">+15</button>
        </div>
      </div>
    </div>
    <p class="note" id="editNote" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="deleteBtn">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="csvSheet" aria-labelledby="csvTitle">
  <div class="sheet-body">
    <h3 id="csvTitle" tabindex="-1">Copy the log</h3>
    <p class="sub">This browser wouldn’t copy for you. Press and hold the text, choose Select all, then Copy.</p>
    <textarea id="csvText" rows="8" readonly wrap="off" spellcheck="false" aria-label="The log as CSV"></textarea>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="csvClose">Done</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" hidden>Undo</button>
</div>

<script>
(() => {
  'use strict';

  const KEY = 'work-log.v2';
  const OLD_KEY = 'work-log.v1';   // the days-only log this version grew out of; it is copied from, never changed
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const KINDS = ['wfh', 'office', 'off', 'after'];
  const TIMED = ['wfh', 'office', 'after'];   // the kinds that carry a start and an end
  const LABEL = { wfh: 'wfh', office: 'office', off: "didn't work", after: 'after hours' };
  const SPOKEN = { wfh: 'working from home', office: 'at the office', off: "didn't work", after: 'after hours' };
  const CSV_TYPE = { wfh: 'wfh', office: 'office', off: 'didnt_work', after: 'after_hours' };
  const MIN = 60000;
  const SIX_HOURS = 6 * 60 * MIN;   // an after-hours session left open longer than this counts as forgotten
  const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

  const $ = id => document.getElementById(id);
  const els = {
    tiles: Array.from(document.querySelectorAll('.tile')),
    list: $('list'), status: $('status'),
    add: $('addBtn'), copy: $('copyBtn'),
    editSheet: $('editSheet'), editForm: $('editForm'), editTitle: $('editTitle'), day: $('editDay'),
    seg: Array.from(document.querySelectorAll('.seg-btn')), timeBox: $('timeBox'),
    start: $('editStart'), end: $('editEnd'), nudges: Array.from(document.querySelectorAll('.nudge button')),
    note: $('editNote'), save: $('saveBtn'), del: $('deleteBtn'), cancel: $('cancelBtn'),
    csvSheet: $('csvSheet'), csvText: $('csvText'), csvClose: $('csvClose'),
    sheetSync: $('sheet-sync'),
    toast: $('toast'), toastMsg: $('toastMsg'), undo: $('toastUndo'),
  };

  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayIso = () => iso(new Date());
  const shift = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return iso(d); };
  const isDate = s => typeof s === 'string' && DATE_RE.test(s) && iso(parse(s)) === s;
  const isWeekday = k => { const w = parse(k).getDay(); return w > 0 && w < 6; };
  const fmtDay = k => { const d = parse(k); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const fmtMonth = key => { const [y, m] = key.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
  const clock = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const at = (k, h, m) => { const [y, mo, d] = k.split('-').map(Number); return new Date(y, mo - 1, d, h, m).getTime(); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------- saving: the log lives in this browser's storage on this phone ---------- */

  // An entry is { id, date, kind, start, end }. start and end are times in ms, or null. A day has at most one
  // entry that is wfh, office or didn't work, and any number of after-hours sessions.
  let canSave = true;
  let copiedFromOld = false;

  const goodTime = v => (typeof v === 'number' && Number.isFinite(v) && v > 0 ? Math.round(v) : null);

  function clean(list) {
    const out = [];
    const ids = new Set();
    const mains = new Set();
    for (const e of list) {
      if (!e || !isDate(e.date) || !KINDS.includes(e.kind)) continue;
      if (e.kind !== 'after') {
        if (mains.has(e.date)) continue;
        mains.add(e.date);
      }
      let id = typeof e.id === 'string' && e.id ? e.id : newId();
      while (ids.has(id)) id = newId();
      ids.add(id);
      const timed = TIMED.includes(e.kind);
      out.push({ id, date: e.date, kind: e.kind, start: timed ? goodTime(e.start) : null, end: timed ? goodTime(e.end) : null });
    }
    return out;
  }

  // First run of this version: copy the days from the old log (date and place only). The old copy stays as it was.
  function fromOldLog() {
    let raw = null;
    try { raw = localStorage.getItem(OLD_KEY); } catch (_) { return []; }
    if (!raw) return [];
    try {
      const list = JSON.parse(raw);
      if (!Array.isArray(list)) return [];
      const days = clean(list.filter(e => e && ['wfh', 'office', 'off'].includes(e.place)).map(e => ({ date: e.date, kind: e.place })));
      copiedFromOld = days.length > 0;
      return days;
    } catch (_) { return []; }
  }

  function read() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (_) { canSave = false; return []; }
    if (!raw) return fromOldLog();
    try {
      const list = JSON.parse(raw);
      if (Array.isArray(list)) return clean(list);
    } catch (_) {}
    // Unreadable: keep the raw text aside instead of letting the next save overwrite it, and start from the old log's days.
    try { localStorage.setItem(KEY + '.unreadable', raw); } catch (_) {}
    return fromOldLog();
  }

  let entries = read();

  function write() {
    try { localStorage.setItem(KEY, JSON.stringify(entries)); canSave = true; }
    catch (_) { canSave = false; }
    if (canSave) Promise.resolve().then(changed);   // after start-up, once the sync code below is ready
  }

  if (copiedFromOld) write();

  // Pick up changes made in another tab, without dropping anything that failed to save here.
  function sync() {
    const fresh = read();
    if (canSave) entries = fresh;
  }

  // Ask the browser not to clear this data when the phone is short on space.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}

  const snapshot = () => entries.map(e => ({ ...e }));

  function commit(message, before) {
    write();
    render();
    if (!canSave) { toast("Couldn't save on this phone."); return; }
    toast(message, () => { entries = before; write(); render(); });
  }

  /* ---------- finding things ---------- */

  const rank = e => (e.kind === 'after' ? 1 : 0);
  // Oldest first: by day, then the day's main entry, then after-hours sessions in the order they started.
  const byTime = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || rank(a) - rank(b) || (a.start || 0) - (b.start || 0) || (a.id < b.id ? -1 : 1);
  const mainOn = date => entries.find(e => e.date === date && e.kind !== 'after') || null;
  const afterOn = date => entries.filter(e => e.date === date && e.kind === 'after').sort(byTime);
  // Still going: started but not finished. An after-hours session can run past midnight, so it is judged by its age.
  const isRunning = (e, now, today) => !!e.start && !e.end &&
    (e.kind === 'after' ? e.start <= now && now - e.start < SIX_HOURS : e.date === today);
  const runningAfter = now => {
    const today = todayIso();
    return entries.filter(e => e.kind === 'after' && isRunning(e, now, today)).sort(byTime).pop() || null;
  };

  /* ---------- drawing ---------- */

  const mk = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // 09:02 → 17:05, start in green and end in red. A missing end is only called out once the day is over.
  function timesNode(e, now, today) {
    const box = mk('span', 'times');
    box.append(e.start ? mk('b', 's', clock(e.start)) : mk('i', 'gap', 'no start'));
    const arrow = mk('i', 'arrow', '→');
    arrow.setAttribute('aria-hidden', 'true');
    box.append(arrow);
    if (e.end) box.append(mk('b', 'e', clock(e.end)));
    else if (!isRunning(e, now, today)) box.append(mk('i', 'gap', 'no end'));
    return box;
  }

  function fillWhen(box, e, extra, hint, now, today) {
    box.replaceChildren();
    if (e && (e.start || e.end)) {
      box.append(timesNode(e, now, today));
      if (extra > 1) box.append(mk('span', 'more', `· ${extra} today`));
    } else if (hint) {
      box.append(mk('span', 'hint', hint));
    }
  }

  function tileLabel(kind, m, sessions, running) {
    if (kind === 'off') return m && m.kind === 'off' ? "Today: didn't work. Logged" : "Log today as a day you didn't work";
    if (kind === 'after') {
      if (running) return `After hours, started ${clock(running.start)}. Tap to finish`;
      return sessions.length ? `Start another after hours session. ${sessions.length} so far today` : 'Start an after hours session';
    }
    const name = SPOKEN[kind];
    if (m && m.kind === kind) {
      if (m.start && m.end) return `${cap(name)} today, ${clock(m.start)} to ${clock(m.end)}. Finished`;
      if (m.start) return `${cap(name)} today, started ${clock(m.start)}. Tap to finish`;
      return `${cap(name)} today. Tap to start the clock`;
    }
    return kind === 'wfh' ? 'Start working from home today' : 'Start an office day today';
  }

  function renderTiles() {
    const now = Date.now();
    const today = todayIso();
    const weekend = !isWeekday(today);
    const m = mainOn(today);
    const sessions = afterOn(today);
    const running = runningAfter(now);
    for (const t of els.tiles) {
      const kind = t.dataset.place;
      const when = t.querySelector('.when');
      const closed = weekend && kind !== 'after';
      let on = false;
      if (kind === 'after') {
        const shown = running || sessions[sessions.length - 1] || null;
        on = !!shown && (!!running || sessions.length > 0);
        fillWhen(when, shown, sessions.length, 'tap to start', now, today);
      } else if (kind === 'off') {
        on = !!m && m.kind === 'off';
      } else {
        on = !!m && m.kind === kind;
        fillWhen(when, on ? m : null, 0, '', now, today);
      }
      t.classList.toggle('is-today', on);
      t.classList.toggle('is-closed', closed);
      t.setAttribute('aria-disabled', String(closed));
      t.setAttribute('aria-label', tileLabel(kind, m, sessions, running) + (closed ? '. Closed at weekends' : ''));
    }
  }

  function rowLabel(e, now, today) {
    let s = `${fmtDay(e.date)}: ${SPOKEN[e.kind]}`;
    if (TIMED.includes(e.kind)) {
      if (e.start && e.end) s += `, ${clock(e.start)} to ${clock(e.end)}`;
      else if (e.start) s += isRunning(e, now, today) ? `, started ${clock(e.start)}, still going` : `, started ${clock(e.start)}, no end time`;
      else if (e.end) s += `, finished ${clock(e.end)}, no start time`;
    }
    return s + '. Edit';
  }

  let lastSig = '';

  function render() {
    renderTiles();
    const now = Date.now();
    const today = todayIso();

    let message = '';
    if (!canSave) message = "This browser won't save entries, so they'll be lost when the page closes.";
    else if (!entries.length) message = 'Nothing logged yet. Tap wfh or office when you start work and again when you finish. Tap a day here later to change it.';
    els.status.textContent = message;
    els.status.hidden = !message;

    const sig = today + '|' + entries.map(e => [e.id, e.date, e.kind, e.start, e.end].join(':')).join(',');
    if (sig === lastSig) return;
    lastSig = sig;

    const byDate = new Map();
    for (const e of entries) {
      if (!byDate.has(e.date)) byDate.set(e.date, []);
      byDate.get(e.date).push(e);
    }
    const dates = [...byDate.keys()].sort().reverse();

    const counts = new Map();
    for (const e of entries) {
      const key = e.date.slice(0, 7);
      const c = counts.get(key) || { wfh: 0, office: 0, off: 0, after: 0 };
      c[e.kind] += 1;
      counts.set(key, c);
    }

    const frag = document.createDocumentFragment();
    let currentKey = null;
    for (const d of dates) {
      const key = d.slice(0, 7);
      if (key !== currentKey) {
        currentKey = key;
        const c = counts.get(key);
        const head = mk('div', 'month');
        const parts = [];
        if (c.office) parts.push(`${c.office} office`);
        if (c.wfh) parts.push(`${c.wfh} wfh`);
        if (c.off) parts.push(`${c.off} didn't work`);
        if (c.after) parts.push(`${c.after} after hours`);
        // Each count stays in one piece, so a long tally wraps between counts and not inside "after hours".
        const tally = mk('span', 'counts');
        parts.forEach((p, i) => { if (i) tally.append(' · '); tally.append(mk('span', 'part', p)); });
        head.append(mk('span', null, fmtMonth(key)), tally);
        frag.append(head);
      }
      byDate.get(d).sort(byTime).forEach((e, i) => {
        const row = mk('button', 'row' + (d === today ? ' today' : '') + (i > 0 ? ' more' : ''));
        row.type = 'button';
        row.dataset.id = e.id;
        row.setAttribute('aria-label', rowLabel(e, now, today));
        const pill = mk('span', 'pill ' + e.kind);
        pill.append(mk('i', 'dot'), document.createTextNode(LABEL[e.kind]));
        const mid = mk('span', 'mid');
        mid.append(pill);
        if (TIMED.includes(e.kind) && (e.start || e.end)) mid.append(timesNode(e, now, today));
        row.append(mk('span', 'd', fmtDay(d)), mid);
        row.insertAdjacentHTML('beforeend', CHEVRON);
        frag.append(row);
      });
    }

    const active = document.activeElement;
    const focusId = active && active.classList && active.classList.contains('row') ? active.dataset.id : null;
    els.list.replaceChildren(frag);
    if (focusId) {
      const again = els.list.querySelector(`.row[data-id="${focusId}"]`);
      if (again) again.focus({ preventScroll: true });
    }
  }

  /* ---------- toast ---------- */

  let toastTimer = 0;
  function toast(message, undo) {
    els.toastMsg.textContent = message;
    els.undo.hidden = !undo;
    els.undo.onclick = undo ? () => { hideToast(); undo(); toast('Undone'); } : null;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 6000 : 2800);
  }
  function hideToast() {
    clearTimeout(toastTimer);
    els.toast.classList.remove('show');
  }

  /* ---------- tapping a tile ---------- */

  function flash(el) {
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
  }

  // wfh, office and didn't work: the first tap starts the day, the same tile again finishes it, and a different tile changes the place.
  function tapMain(kind, tile) {
    const today = todayIso();
    if (!isWeekday(today)) { toast('Weekends are for after hours. To log anything else, use Add a past day.'); return; }
    const now = Date.now();
    const m = mainOn(today);
    const before = snapshot();
    let message;
    if (!m) {
      entries.push({ id: newId(), date: today, kind, start: kind === 'off' ? null : now, end: null });
      message = kind === 'off' ? "Today: didn't work" : `Started ${LABEL[kind]} at ${clock(now)}`;
    } else if (m.kind === kind) {
      if (kind === 'off') { toast('Already logged today.'); return; }
      if (!m.start) { m.start = now; message = `Started ${LABEL[kind]} at ${clock(now)}`; }
      else if (!m.end) { m.end = now; message = `Finished at ${clock(now)}`; }
      else { toast('Today already has a start and an end. Tap the day to change them.'); return; }
    } else {
      const was = LABEL[m.kind];
      if (kind === 'off') { m.kind = 'off'; m.start = null; m.end = null; message = `Today: didn't work (was ${was})`; }
      else if (m.kind === 'off') { m.kind = kind; m.start = now; m.end = null; message = `Today: ${LABEL[kind]}, started ${clock(now)} (was ${was})`; }
      else { m.kind = kind; message = `Today: ${LABEL[kind]} (was ${was})`; }
    }
    flash(tile);
    commit(message, before);
  }

  // After hours: each session is its own row. Tap to start one, tap to finish it, tap again for the next.
  function tapAfter(tile) {
    const now = Date.now();
    const before = snapshot();
    const running = runningAfter(now);
    let message;
    if (running) { running.end = now; message = `After hours: finished ${clock(now)}`; }
    else {
      entries.push({ id: newId(), date: todayIso(), kind: 'after', start: now, end: null });
      message = `After hours: started ${clock(now)}`;
    }
    flash(tile);
    commit(message, before);
  }

  /* ---------- editing an entry ---------- */

  let editing = null;
  let needsReload = false;   // a newer version arrived while a sheet was open

  // Reads a typed time: 905, 0905, 9:05, 9.05, 9, 17:05, and a trailing am/pm. Gives { h, m, ap } or null.
  function parseTime(text) {
    let s = String(text || '').trim().toLowerCase();
    let ap = '';
    const suffix = s.match(/\s*([ap])\.?\s*m?\.?$/);
    if (suffix) { ap = suffix[1]; s = s.slice(0, suffix.index).trim(); }
    s = s.replace(/\s*:\s*/g, ':').replace(/[.\s]+/g, ':');
    let h, mi;
    if (s.includes(':')) {
      const parts = s.split(':');
      if (parts.length !== 2 || !/^\d{1,2}$/.test(parts[0]) || !/^\d{1,2}$/.test(parts[1])) return null;
      h = +parts[0]; mi = +parts[1];
    } else {
      if (!/^\d{1,4}$/.test(s)) return null;
      if (s.length <= 2) { h = +s; mi = 0; } else { h = +s.slice(0, -2); mi = +s.slice(-2); }
    }
    if (ap) {
      if (h < 1 || h > 12) return null;
      if (ap === 'p' && h < 12) h += 12;
      if (ap === 'a' && h === 12) h = 0;
    }
    if (h > 23 || mi > 59) return null;
    return { h, m: mi, ap };
  }

  // The last 60 days, plus whichever day is being edited. Days that already have something show what.
  function fillDays(selected) {
    const today = todayIso();
    const keys = new Set([selected]);
    for (let i = 0; i < 60; i++) keys.add(shift(today, -i));
    const options = [...keys].sort().reverse().map(k => {
      const o = document.createElement('option');
      o.value = k;
      let text = fmtDay(k);
      if (k === today) text = 'Today · ' + text;
      else if (k === shift(today, -1)) text = 'Yesterday · ' + text;
      const have = [];
      const m = mainOn(k);
      if (m) have.push(LABEL[m.kind]);
      if (afterOn(k).length) have.push('after hours');
      if (have.length) text += ` (${have.join(' + ')})`;
      o.textContent = text;
      return o;
    });
    els.day.replaceChildren(...options);
    els.day.value = selected;
  }

  // Adding a day starts on the latest weekday you missed since you started logging, else yesterday.
  function defaultAddDate() {
    const yesterday = shift(todayIso(), -1);
    const first = entries.map(e => e.date).sort()[0];
    if (!first) return yesterday;
    for (let k = yesterday, i = 0; k >= first && i < 59; k = shift(k, -1), i++) {
      if (isWeekday(k) && !mainOn(k)) return k;
    }
    return yesterday;
  }

  // What the sheet currently says, as real times. An end that comes out before the start is taken to be the next day.
  function readForm() {
    const date = els.day.value;
    const kind = editing ? editing.kind : null;
    const f = { date, kind, start: null, end: null, nextDay: false, badStart: false, badEnd: false };
    if (!editing || !kind || !TIMED.includes(kind) || !isDate(date)) return f;
    const orig = editing.orig;
    const sText = els.start.value.trim();
    const eText = els.end.value.trim();
    const s = sText ? parseTime(sText) : null;
    const e = eText ? parseTime(eText) : null;
    f.badStart = !!sText && !s;
    f.badEnd = !!eText && !e;
    if (f.badStart || f.badEnd) return f;
    // Fields left as they were keep their exact saved time, seconds and all.
    const startKept = !!orig && orig.date === date && sText === editing.startText;
    f.start = sText ? (startKept ? orig.start : at(date, s.h, s.m)) : null;
    if (eText) {
      if (startKept && eText === editing.endText) f.end = orig.end;
      else {
        let t = at(date, e.h, e.m);
        if (f.start != null && t <= f.start) t = at(shift(date, 1), e.h, e.m);
        f.end = t;
      }
      f.nextDay = f.start != null && iso(new Date(f.end)) !== iso(new Date(f.start));
    }
    return f;
  }

  const tidyStart = () => {
    const t = parseTime(els.start.value);
    if (t) els.start.value = pad(t.h) + ':' + pad(t.m);
  };
  // A bare end time that would fall before the start is read as the afternoon: with a 09:02 start, "5" means 17:00.
  const tidyEnd = () => {
    const t = parseTime(els.end.value);
    if (!t) return;
    let h = t.h;
    const f = readForm();
    if (f.start != null && !t.ap && h >= 1 && h <= 11 && at(f.date, h, t.m) <= f.start && at(f.date, h + 12, t.m) > f.start) h += 12;
    els.end.value = pad(h) + ':' + pad(t.m);
  };

  function paintSeg() {
    for (const b of els.seg) b.setAttribute('aria-checked', String(!!editing && b.dataset.place === editing.kind));
    els.timeBox.hidden = !!editing && editing.kind === 'off';
  }

  function validate() {
    if (!editing) return;
    const f = readForm();
    const notes = [];
    els.start.classList.toggle('bad', f.badStart);
    els.end.classList.toggle('bad', f.badEnd);
    const unreadable = f.badStart || f.badEnd;
    if (unreadable) notes.push("Couldn't read that time. Try 9:15, 915 or 3pm.");
    else if (f.nextDay) notes.push('Ends the next day.');
    if (f.kind && f.kind !== 'after' && isDate(f.date)) {
      const other = entries.find(e => e.date === f.date && e.kind !== 'after' && (!editing.orig || e.id !== editing.orig.id));
      if (other) notes.push(`${fmtDay(f.date)} already has an entry (${LABEL[other.kind]}). Saving replaces it.`);
    }
    els.note.textContent = notes.join(' ');
    els.note.classList.toggle('warn', unreadable);
    for (const b of els.nudges) b.disabled = f[b.dataset.for] == null;
    const o = editing.orig;
    const changed = !o || f.date !== o.date || f.kind !== o.kind || f.start !== o.start || f.end !== o.end;
    els.save.disabled = !f.kind || !isDate(f.date) || unreadable || !changed;
  }

  function openEdit(id) {
    const cur = id ? entries.find(e => e.id === id) : null;
    if (id && !cur) return;
    editing = { orig: cur ? { ...cur } : null, kind: cur ? cur.kind : null, startText: '', endText: '' };
    els.editTitle.textContent = cur ? `Edit ${fmtDay(cur.date)}` : 'Add a past day';
    fillDays(cur ? cur.date : defaultAddDate());
    els.start.value = cur && cur.start ? clock(cur.start) : '';
    els.end.value = cur && cur.end ? clock(cur.end) : '';
    editing.startText = els.start.value;
    editing.endText = els.end.value;
    els.del.hidden = !cur;
    paintSeg();
    validate();
    if (!els.editSheet.open) els.editSheet.showModal();
  }

  els.editForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!editing) return;
    tidyStart();
    tidyEnd();
    validate();
    if (els.save.disabled) return;
    const f = readForm();
    const { orig } = editing;
    const before = snapshot();
    // A day has one wfh, office or didn't work entry, so saving one replaces whatever was there.
    if (f.kind !== 'after') entries = entries.filter(x => x.kind === 'after' || x.date !== f.date || (orig && x.id === orig.id));
    const cur = orig ? entries.find(x => x.id === orig.id) : null;
    if (cur) Object.assign(cur, { date: f.date, kind: f.kind, start: f.start, end: f.end });
    else entries.push({ id: newId(), date: f.date, kind: f.kind, start: f.start, end: f.end });
    els.editSheet.close();
    commit(orig ? `Saved ${fmtDay(f.date)}` : `Added ${fmtDay(f.date)}`, before);
  });

  els.del.addEventListener('click', () => {
    if (!editing || !editing.orig) return;
    const { orig } = editing;
    const before = snapshot();
    entries = entries.filter(x => x.id !== orig.id);
    els.editSheet.close();
    commit(`Deleted ${fmtDay(orig.date)}`, before);
  });

  els.seg.forEach(b => b.addEventListener('click', () => {
    if (!editing) return;
    editing.kind = b.dataset.place;
    paintSeg();
    validate();
  }));
  els.day.addEventListener('change', validate);
  els.cancel.addEventListener('click', () => els.editSheet.close());

  // Tapping a time selects it all, so typing replaces it. (Phones place the cursor after the tap, so select again on finger-up.)
  function wireTime(input, tidy) {
    let typed = false;
    const select = () => { if (!typed) { try { input.select(); } catch (_) {} } };
    input.addEventListener('focus', () => { typed = false; setTimeout(select, 0); });
    input.addEventListener('pointerup', () => setTimeout(select, 0));
    input.addEventListener('input', () => { typed = true; validate(); });
    input.addEventListener('blur', () => { tidy(); validate(); });
  }
  wireTime(els.start, tidyStart);
  wireTime(els.end, tidyEnd);

  for (const b of els.nudges) {
    b.addEventListener('click', () => {
      const f = readForm();
      const base = f[b.dataset.for];
      if (base == null) return;
      (b.dataset.for === 'start' ? els.start : els.end).value = clock(base + Number(b.dataset.min) * MIN);
      validate();
    });
  }

  /* ---------- copying the log out ---------- */

  // Local time with its offset, so a time reads the same whatever the clocks do.
  function stamp(t) {
    const d = new Date(t);
    const off = -d.getTimezoneOffset(), a = Math.abs(off);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
      (off < 0 ? '-' : '+') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
  }
  const csvField = s => (/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
  // The whole log, oldest first: one row per entry, keyed by its id. A day with after hours has a row for each session.
  const buildCsv = () => 'id,date,type,start,end\n' +
    [...entries].sort(byTime).map(e =>
      [csvField(e.id), e.date, CSV_TYPE[e.kind], e.start ? stamp(e.start) : '', e.end ? stamp(e.end) : ''].join(',')
    ).join('\n') + '\n';

  els.copy.addEventListener('click', async () => {
    sync();
    if (!entries.length) { toast('Nothing to copy yet'); return; }
    const text = buildCsv();
    const n = entries.length;
    try {
      await navigator.clipboard.writeText(text);
      toast('Copied ' + n + (n === 1 ? ' entry' : ' entries') + ' as CSV');
    } catch (_) {
      // Some browsers won't write to the clipboard: show the text so it can be copied by hand.
      els.csvText.value = text;
      if (!els.csvSheet.open) els.csvSheet.showModal();
      els.csvText.focus();
      els.csvText.select();
    }
  });
  els.csvClose.addEventListener('click', () => els.csvSheet.close());

  /* ---------- wiring ---------- */

  els.tiles.forEach(t => t.addEventListener('click', () => {
    const kind = t.dataset.place;
    if (kind === 'after') tapAfter(t); else tapMain(kind, t);
  }));
  els.tiles.forEach(t => t.addEventListener('animationend', () => t.classList.remove('flash')));
  els.list.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (row) openEdit(row.dataset.id);
  });
  els.add.addEventListener('click', () => openEdit(null));

  for (const sheet of [els.editSheet, els.csvSheet]) {
    sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
    sheet.addEventListener('close', () => {
      if (sheet === els.editSheet) editing = null;
      if (needsReload) location.reload();
    });
  }

  // ---------- sending the log to the Tracking log sheet ----------
  // Off until the setup link (…/#log=<web app address>&key=<key>) has been opened in any tracker on this site.
  // Every change sends the whole log, so edits and deletes reach the sheet too. A send that
  // fails (no signal) is repeated when the app is next opened or comes back online.
  const LINK = 'tracking-log.link.v1';   // one setting for every tracker on this site
  const UNSENT = KEY + '.unsent';
  const SENT_ONCE = KEY + '.sent-once';  // until the first send, the whole existing log still needs to go
  const SOURCE = 'work_app';
  const okUrl = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) ||
    /^http:\/\/(localhost|127\.0\.0\.1):\d+\/[\w/-]*$/.test(u);

  function link() {
    try {
      const v = JSON.parse(localStorage.getItem(LINK) || 'null');
      if (v && typeof v.url === 'string' && okUrl(v.url) && typeof v.key === 'string' && v.key) return v;
    } catch (_) {}
    return null;
  }
  const unsent = () => { try { return localStorage.getItem(UNSENT) === '1'; } catch (_) { return false; } };
  const setUnsent = on => { try { if (on) localStorage.setItem(UNSENT, '1'); else localStorage.removeItem(UNSENT); } catch (_) {} };

  const SHEET_LABELS = { sent: 'synced', sending: 'syncing…', waiting: 'not synced yet', paused: 'sync paused', error: 'sync error' };
  let sheetState = '';
  function setSheet(state, note) {
    const was = sheetState;
    sheetState = state;
    const on = !!link() && !!SHEET_LABELS[state];
    els.sheetSync.hidden = !on;
    els.sheetSync.textContent = on ? SHEET_LABELS[state] : '';
    els.sheetSync.title = note || '';
    els.sheetSync.classList.toggle('warn', state === 'paused' || state === 'error');
    if ((state === 'paused' || state === 'error') && state !== was) toast('Sheet: ' + (note || SHEET_LABELS[state]), null, 6000);
  }

  function callSheet(cfg, body) {
    // A plain-text body keeps this a simple request, which Google's web apps accept from another site.
    return fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: cfg.key }, body)) })
      .then(res => res.json());
  }

  let sending = false, sendAgain = false, sendTimer = 0;
  function queueSend(ms) { clearTimeout(sendTimer); sendTimer = setTimeout(sendLog, ms); }

  function changed() {
    setUnsent(true);
    if (link()) { setSheet('waiting'); queueSend(1200); }
  }

  // One row per entry in the sheet's format: id, time, what, value (and note).
  function sheetRows() {
    // A timed entry is two rows, a start and an end, sharing the entry's id. A day with no times
    // (didn't work, or a day copied from the old log) is one row at midnight.
    const out = [];
    for (const e of entries) {
      const midnight = stamp(at(e.date, 0, 0));
      if (e.kind === 'off') { out.push({ id: e.id, time: midnight, what: 'work_off', value: '' }); continue; }
      const place = CSV_TYPE[e.kind];
      if (e.start) out.push({ id: e.id + '.start', time: stamp(e.start), what: 'work_start', value: place });
      else out.push({ id: e.id, time: midnight, what: 'work_day', value: place });
      if (e.end) out.push({ id: e.id + '.end', time: stamp(e.end), what: 'work_end', value: place });
    }
    return out;
  }

  async function sendLog() {
    const cfg = link();
    if (!cfg) { setSheet(''); return; }
    if (sending) { sendAgain = true; return; }
    if (!unsent()) { setSheet('sent'); return; }
    sending = true;
    sendAgain = false;
    setSheet('sending');
    sync();
    let res = null;
    try { res = await callSheet(cfg, { source: SOURCE, rows: sheetRows() }); } catch (_) {}
    sending = false;
    if (res && res.ok) {
      if (!sendAgain) setUnsent(false);
      try { localStorage.setItem(SENT_ONCE, '1'); } catch (_) {}
      setSheet('sent');
    } else if (res && res.code === 'shrink') {
      setSheet('paused', res.error);
    } else if (res) {
      setSheet('error', res.error || 'it said no');
    } else {
      setSheet('waiting');
    }
    if (sendAgain) queueSend(300);
  }
  const sendIfNeeded = () => { if (link() && unsent()) queueSend(0); };

  // The setup link: saves where to send, checks the sheet answers, then sends what's already here.
  function setupFromLink() {
    const h = new URLSearchParams(location.hash.slice(1));
    const url = h.get('log'), key = h.get('key');
    if (!url && !key) return false;
    history.replaceState(null, '', location.pathname + location.search);
    if (!url || !key || !okUrl(url)) { toast('That setup link doesn’t look right', null, 5000); return true; }
    try { localStorage.setItem(LINK, JSON.stringify({ url, key })); }
    catch (_) { toast('Couldn’t save the sync setting in this browser', null, 5000); return true; }
    setUnsent(true);
    setSheet('sending');
    callSheet({ url, key }, { ping: true }).then(res => {
      if (res && res.ok) {
        toast('Sync is on: work entries now go to the sheet', null, 4000);
        sendIfNeeded();
      } else {
        setSheet('error', (res && res.error) || 'no answer');
      }
    }).catch(() => {
      // Online but no readable answer usually means the web app isn't shared with Anyone.
      if (navigator.onLine) setSheet('error', 'couldn’t reach the sheet: check the web app’s access is set to Anyone');
      else setSheet('waiting');
    });
    return true;
  }
  function startSheet() {
    if (setupFromLink() || !link()) return;
    try { if (localStorage.getItem(SENT_ONCE) !== '1') setUnsent(true); } catch (_) {}
    if (unsent()) queueSend(0); else setSheet('sent');
  }

  window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) { sync(); render(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); render(); sendIfNeeded(); } });
  window.addEventListener('online', sendIfNeeded);
  window.addEventListener('hashchange', setupFromLink);   // the setup link tapped while the app is already open
  setInterval(render, 60000);
  render();
  startSheet();

  if ('serviceWorker' in navigator) {
    // When a newer version of the page takes over, reload once so it shows up without any effort.
    const hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadWorker) return;
      if (els.editSheet.open || els.csvSheet.open) needsReload = true; else location.reload();
    });
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
