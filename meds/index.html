<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Meds Log</title>
<meta name="theme-color" content="#16181B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F1F2EF" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: two tap tiles (morning sun, evening moon) with a melatonin bar under them, then a day-by-day log of tappable times. Bottom sheets for changing a time and for copying the log. */
:root {
  color-scheme: dark;
  --bg: #16181b;
  --surface: #1f2226;
  --line: #2a2e33;
  --fg: #e9ebee;
  --muted: #868c95;
  --am-tile: #362c1b;
  --am-ink: #e6c27a;
  --pm-tile: #262a40;
  --pm-ink: #b4b9e6;
  --mel-tile: #3a2733;
  --mel-ink: #f0b3c9;
  --danger: #e8968a;
  --scrim: rgba(5, 6, 8, 0.62);
  --toast-bg: #2a2e34;
  --toast-fg: #e9ebee;
  --toast-accent: #e6c27a;
  --font-ui: "Lexend", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f1f2ef;
    --surface: #fafaf8;
    --line: #dee1dd;
    --fg: #2e3336;
    --muted: #646c70;
    --am-tile: #f1e3c3;
    --am-ink: #7a5a1e;
    --pm-tile: #dfe1f1;
    --pm-ink: #424a7d;
    --mel-tile: #f3dce5;
    --mel-ink: #8a3358;
    --danger: #a0443a;
    --scrim: rgba(28, 34, 38, 0.34);
    --toast-bg: #2e3336;
    --toast-fg: #f1f2ef;
    --toast-accent: #e6c27a;
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.app {
  max-width: 520px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  aspect-ratio: 5 / 6;
  max-width: 100%;
  min-width: 0;   /* the ratio must not widen the column when the content is taller than the box */
  padding: 12px 8px;
  border: 0;
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.12s ease;
}
.tile.morning { background: var(--am-tile); color: var(--am-ink); }
.tile.evening { background: var(--pm-tile); color: var(--pm-ink); }
.tile.melatonin {
  grid-column: 1 / -1;
  aspect-ratio: auto;
  flex-direction: row;
  justify-content: flex-start;
  gap: 14px;
  padding: 20px 24px;
  background: var(--mel-tile);
  color: var(--mel-ink);
  text-align: left;
}
.tile svg { width: 52px; height: 52px; margin-bottom: 4px; }
.tile.melatonin svg { width: 30px; height: 30px; margin: 0; flex: none; }
.tile .label { font-family: var(--font-data); font-size: 26px; font-weight: 500; }
.tile.melatonin .label { font-size: 22px; }
.tile .text { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
/* What the tile records. Two lines are always kept free, so the name and the time sit in the same place on both tiles. */
.tile .drugs {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: calc(2 * 1.35em);
  font-family: var(--font-data);
  font-size: 13.5px;
  line-height: 1.35;
}
.tile .state { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
.tile.done { box-shadow: inset 0 0 0 2px currentColor; }
.tile.done .state { font-weight: 600; }
.tile:active { transform: scale(0.97); }
.tile.flash { animation: flash 0.6s ease-out; }
@keyframes flash {
  from { box-shadow: inset 0 0 0 2px currentColor, 0 0 0 0 currentColor; }
  to { box-shadow: inset 0 0 0 2px currentColor, 0 0 0 14px transparent; }
}

/* Log */
.loghead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.loghead h2 { margin: 0; font-size: 22px; font-weight: 600; }
.sheet-sync { margin-right: auto; font-family: var(--font-data); font-size: 14px; color: var(--muted); }
.sheet-sync::before { content: "· "; }
.sheet-sync.warn { color: var(--danger); }
.legend { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-data); font-size: 14.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }

.link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-block: -10px;
  padding: 10px 2px;
  border: 0;
  background: none;
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}
.link svg { width: 16px; height: 16px; }
.link:hover { color: var(--fg); }

.dot { display: inline-block; flex: none; width: 11px; height: 11px; border-radius: 50%; }
.dot.morning { border: 2.5px solid var(--am-ink); }
.dot.evening { background: var(--pm-ink); }
.dot.melatonin { width: 9px; height: 9px; border-radius: 2px; background: var(--mel-ink); transform: rotate(45deg); }

.status { margin: 18px 0 0; max-width: 44ch; color: var(--muted); font-size: 15px; line-height: 1.55; }

.days { list-style: none; margin: 0; padding: 0; }
.month {
  padding-block: 20px 4px;
  font-family: var(--font-data);
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.day {
  display: grid;
  grid-template-columns: 7.5rem minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  min-height: 58px;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
.day .d { font-size: 17px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.day.today .d { color: var(--fg); }
.times { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.none { color: var(--muted); }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 7px 14px 7px 12px;
  border: 0;
  border-radius: 999px;
  font: 500 15px var(--font-data);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  touch-action: manipulation;
}
.pill:active { transform: scale(0.95); }
.pill:focus-visible { outline-offset: 2px; }
.pill.morning { background: var(--am-tile); color: var(--am-ink); }
.pill.evening { background: var(--pm-tile); color: var(--pm-ink); }
.pill.melatonin { background: var(--mel-tile); color: var(--mel-ink); }
.pill .dot.morning, .seg-btn .dot.morning { border-color: currentColor; }
.pill .dot.evening, .seg-btn .dot.evening { background: currentColor; }
.pill .dot.melatonin, .seg-btn .dot.melatonin { background: currentColor; }

/* Sheets */
.sheet {
  border: 0;
  padding: 0;
  margin: auto auto 0;
  width: 100%;
  max-width: 520px;
  max-height: 100%;
  border-radius: 26px 26px 0 0;
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
}
.sheet::backdrop { background: var(--scrim); }
.sheet[open] { animation: rise 0.22s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-inline: 20px;
  padding-block: 22px calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheet h3 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; outline: none; }
.sheet .sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 8px;
  border: 2px solid transparent;
  border-radius: 18px;
  font-family: var(--font-data);
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  opacity: 0.55;
  touch-action: manipulation;
}
.seg-btn.morning { background: var(--am-tile); color: var(--am-ink); }
.seg-btn.evening { background: var(--pm-tile); color: var(--pm-ink); }
.seg-btn.melatonin { grid-column: 1 / -1; background: var(--mel-tile); color: var(--mel-ink); }
.seg-btn[aria-checked="true"] { opacity: 1; border-color: currentColor; }

.fields { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > span {
  font-family: var(--font-data);
  font-size: 12.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.field select, .field input {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 50px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px var(--font-ui);
}
.field input { font: 600 18px var(--font-data); font-variant-numeric: tabular-nums; }
.field input.bad { border-color: var(--danger); }
.field input::placeholder { color: var(--muted); font-weight: 400; }

.nudge { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.nudge button {
  height: 40px;
  min-width: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: none;
  color: var(--fg);
  font: 500 13px var(--font-data);
  cursor: pointer;
  touch-action: manipulation;
}
.nudge button:active:not(:disabled) { transform: scale(0.95); background: var(--line); }
.nudge button:disabled { opacity: 0.35; cursor: default; }

.note { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 14px; }
.note.warn { color: var(--danger); }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.btn {
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: none;
  color: var(--fg);
  font: 500 15px var(--font-ui);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.danger { padding-inline: 4px; border-color: transparent; color: var(--danger); }

.sheet textarea {
  width: 100%;
  min-width: 0;
  resize: vertical;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.5 var(--font-data);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 12px 12px 12px 18px;
  border-radius: 16px;
  background: var(--toast-bg);
  color: var(--toast-fg);
  font-size: 15px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 140%);
  transition: transform 0.22s ease, opacity 0.22s ease;
}
.toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.toast button {
  padding: 6px 8px;
  border: 0;
  background: none;
  color: var(--toast-accent);
  font: 600 15px var(--font-ui);
  cursor: pointer;
}

/* Small phones: a little tighter so nothing wraps awkwardly */
@media (max-width: 360px) {
  .tile svg { width: 44px; height: 44px; }
  .tile .label { font-size: 22px; }
  .tile .drugs { font-size: 12.5px; }
  .tile.melatonin { gap: 12px; padding-inline: 18px 14px; }
  .tile.melatonin svg { width: 26px; height: 26px; }
  .tile.melatonin .label { font-size: 18px; }
  .legend { gap: 6px 14px; font-size: 13.5px; }
  .day { grid-template-columns: 6rem minmax(0, 1fr); gap: 8px; }
  .day .d { font-size: 15px; }
  .pill { gap: 7px; padding: 7px 12px 7px 10px; font-size: 14px; }
  .sheet-body { padding-inline: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app">
  <div class="tiles" role="group" aria-label="Log meds">
    <button type="button" class="tile morning" data-kind="morning">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
      </svg>
      <span class="label">morning</span>
      <span class="drugs" aria-hidden="true"><span>lamotrigine</span><span>concerta</span></span>
      <span class="state">not yet today</span>
    </button>
    <button type="button" class="tile evening" data-kind="evening">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
      <span class="label">evening</span>
      <span class="drugs" aria-hidden="true"><span>lamotrigine</span></span>
      <span class="state">not yet today</span>
    </button>
    <button type="button" class="tile melatonin" data-kind="melatonin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g transform="rotate(-45 12 12)"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M12 8v8"/></g>
      </svg>
      <span class="text"><span class="label">melatonin</span><span class="state">not yet today</span></span>
    </button>
  </div>

  <section aria-labelledby="logTitle">
    <div class="loghead">
      <h2 id="logTitle">meds log</h2>
      <span class="sheet-sync" id="sheet-sync" hidden></span>
      <button type="button" class="link" id="copyBtn" aria-label="Copy CSV of the whole log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        copy csv
      </button>
      <div class="legend" aria-hidden="true">
        <span><i class="dot morning"></i>morning</span>
        <span><i class="dot evening"></i>evening</span>
        <span><i class="dot melatonin"></i>melatonin</span>
      </div>
    </div>
    <p class="status" id="status" hidden></p>
    <ul class="days" id="days"></ul>
  </section>
</main>

<dialog class="sheet" id="editSheet" aria-labelledby="editTitle">
  <form class="sheet-body" id="editForm" novalidate>
    <h3 id="editTitle" tabindex="-1" autofocus>Edit meds</h3>
    <div class="seg" role="radiogroup" aria-label="Which meds">
      <button type="button" class="seg-btn morning" data-kind="morning" role="radio" aria-checked="false"><i class="dot morning"></i>morning</button>
      <button type="button" class="seg-btn evening" data-kind="evening" role="radio" aria-checked="false"><i class="dot evening"></i>evening</button>
      <button type="button" class="seg-btn melatonin" data-kind="melatonin" role="radio" aria-checked="false"><i class="dot melatonin"></i>melatonin</button>
    </div>
    <p class="sub" id="editMeds"></p>
    <div class="fields">
      <label class="field" for="editDay"><span>Day</span><select id="editDay"></select></label>
      <label class="field" for="editTime"><span>Time, 24h</span><input type="text" id="editTime" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="8" placeholder="07:40"></label>
    </div>
    <div class="nudge" role="group" aria-label="Move the time">
      <button type="button" data-min="-60" aria-label="1 hour earlier">−1h</button>
      <button type="button" data-min="-30" aria-label="30 minutes earlier">−30m</button>
      <button type="button" data-min="-15" aria-label="15 minutes earlier">−15m</button>
      <button type="button" data-min="15" aria-label="15 minutes later">+15m</button>
      <button type="button" data-min="30" aria-label="30 minutes later">+30m</button>
      <button type="button" data-min="60" aria-label="1 hour later">+1h</button>
    </div>
    <p class="note" id="editNote" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="deleteBtn">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="csvSheet" aria-labelledby="csvTitle">
  <div class="sheet-body">
    <h3 id="csvTitle" tabindex="-1">Copy the log</h3>
    <p class="sub">This browser wouldn’t copy for you. Press and hold the text, choose Select all, then Copy.</p>
    <textarea id="csvText" rows="8" readonly wrap="off" spellcheck="false" aria-label="The log as CSV"></textarea>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="csvClose">Done</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" hidden>Undo</button>
</div>

<script>
(() => {
  'use strict';

  const KEY = 'meds-log.v2';
  const OLD_KEY = 'meds-log.v1';   // the log this version grew out of; it is copied from, never changed
  const KINDS = ['morning', 'evening', 'melatonin'];
  // What each tile records. One tap is one entry; the copied CSV spells it out with a row for each medicine.
  const MEDS = { morning: ['lamotrigine', 'concerta'], evening: ['lamotrigine'], melatonin: ['melatonin'] };
  const SLOT = { morning: 'morning', evening: 'evening', melatonin: 'evening' };
  const NAME = { morning: 'Morning meds', evening: 'Evening meds', melatonin: 'Melatonin' };
  const TAKEN = { morning: 'Lamotrigine + concerta', evening: 'Lamotrigine', melatonin: 'Melatonin' };
  const SPOKEN = { morning: 'morning meds, lamotrigine and concerta', evening: 'evening meds, lamotrigine', melatonin: 'melatonin' };
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const MIN = 60000;

  const $ = id => document.getElementById(id);
  const els = {
    tiles: Array.from(document.querySelectorAll('.tile')),
    days: $('days'), status: $('status'), copy: $('copyBtn'),
    editSheet: $('editSheet'), editForm: $('editForm'), day: $('editDay'), time: $('editTime'),
    seg: Array.from(document.querySelectorAll('.seg-btn')), meds: $('editMeds'),
    nudges: Array.from(document.querySelectorAll('.nudge button')),
    note: $('editNote'), save: $('saveBtn'), del: $('deleteBtn'), cancel: $('cancelBtn'),
    csvSheet: $('csvSheet'), csvText: $('csvText'), csvClose: $('csvClose'),
    sheetSync: $('sheet-sync'),
    toast: $('toast'), toastMsg: $('toastMsg'), undo: $('toastUndo'),
  };

  const pad = n => String(n).padStart(2, '0');
  const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const clock = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const shiftKey = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); };
  const isDate = s => typeof s === 'string' && DATE_RE.test(s) && dayKey(fromKey(s).getTime()) === s;
  const dayLabel = k => { const d = fromKey(k); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const monthLabel = k => { const d = fromKey(k); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  const atTime = (k, h, m) => { const [y, mo, d] = k.split('-').map(Number); return new Date(y, mo - 1, d, h, m).getTime(); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const isEntry = e => !!e && typeof e.id === 'string' && e.id !== '' && KINDS.includes(e.kind) && Number.isFinite(e.at) && e.at > 0;
  // Oldest first: by time, then morning, evening, melatonin.
  const byTime = (a, b) => a.at - b.at || KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

  /* ---------- saving: the log lives in this browser's storage on this phone ---------- */

  // An entry is { id, kind, at }: which tile was tapped, and when (ms).
  let canSave = true;
  let copiedFromOld = false;

  function clean(list) {
    const out = [];
    const ids = new Set();
    for (const e of list) {
      if (!isEntry(e)) continue;
      let id = e.id;
      while (ids.has(id)) id = newId();
      ids.add(id);
      out.push({ id, kind: e.kind, at: Math.round(e.at) });
    }
    return out.sort(byTime);
  }

  // First run of this version: copy the old log across. The old page's evening tap meant lamotrigine and melatonin
  // together, and this page keeps melatonin as its own entry, so each old evening tap becomes two. The old copy stays as it was.
  function fromOldLog() {
    let raw = null;
    try { raw = localStorage.getItem(OLD_KEY); } catch (_) { return []; }
    if (!raw) return [];
    try {
      const list = JSON.parse(raw);
      if (!Array.isArray(list)) return [];
      const out = [];
      for (const e of list) {
        if (!isEntry(e) || (e.kind !== 'morning' && e.kind !== 'evening')) continue;
        out.push({ id: e.id, kind: e.kind, at: e.at });
        if (e.kind === 'evening') out.push({ id: e.id + '.m', kind: 'melatonin', at: e.at });
      }
      copiedFromOld = out.length > 0;
      return clean(out);
    } catch (_) { return []; }
  }

  function read() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (_) { canSave = false; return []; }
    if (!raw) return fromOldLog();
    try {
      const list = JSON.parse(raw);
      if (Array.isArray(list)) return clean(list);
    } catch (_) {}
    // Unreadable: keep the raw text aside instead of letting the next save overwrite it, and start from the old log.
    try { localStorage.setItem(KEY + '.unreadable', raw); } catch (_) {}
    return fromOldLog();
  }

  let entries = read();

  function write() {
    try { localStorage.setItem(KEY, JSON.stringify(entries)); canSave = true; }
    catch (_) { canSave = false; }
    if (canSave) Promise.resolve().then(changed);   // after start-up, once the sync code below is ready
  }

  if (copiedFromOld) write();

  // Pick up changes made in another tab, without dropping anything that failed to save here.
  function sync() {
    const fresh = read();
    if (canSave) entries = fresh;
  }

  // Ask the browser not to clear this data when the phone is short on space.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}

  const snapshot = () => entries.map(e => ({ ...e }));

  function commit(message, before) {
    entries.sort(byTime);
    write();
    render();
    if (!canSave) { toast("Couldn't save on this phone."); return; }
    toast(message, () => { entries = before; write(); render(); });
  }

  /* ---------- drawing ---------- */

  let lastSig = '';

  function render() {
    const now = Date.now();
    const today = dayKey(now);
    for (const t of els.tiles) {
      const kind = t.dataset.kind;
      const todays = entries.filter(e => e.kind === kind && dayKey(e.at) === today);
      const last = todays[todays.length - 1];
      t.classList.toggle('done', !!last);
      t.querySelector('.state').textContent = last ? `taken ${clock(last.at)}` : 'not yet today';
      t.setAttribute('aria-label', `Log ${SPOKEN[kind]} now` + (last ? `. Logged today at ${clock(last.at)}` : ''));
    }

    let message = '';
    if (!canSave) message = "This browser won't save entries, so they'll be lost when the page closes.";
    else if (!entries.length) message = 'Nothing logged yet. Tap a tile when you take your meds. Forgot? Tap the tile anyway, then tap its time to change it.';
    els.status.textContent = message;
    els.status.hidden = !message;

    const sig = today + '|' + entries.map(e => e.id + e.kind + e.at).join(',');
    if (sig === lastSig) return;
    lastSig = sig;

    const byDay = new Map();
    for (const e of entries) {
      const k = dayKey(e.at);
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(e);
    }
    const frag = document.createDocumentFragment();
    if (entries.length) {
      // Every day from the first entry to today, so a missed day shows as a gap.
      const first = dayKey(entries[0].at);
      const latest = dayKey(entries[entries.length - 1].at);
      const d = fromKey(latest > today ? latest : today);
      let month = '';
      for (let i = 0; i < 4000; i++) {
        const k = dayKey(d.getTime());
        if (k.slice(0, 7) !== month) {
          month = k.slice(0, 7);
          const m = document.createElement('li');
          m.className = 'month';
          m.textContent = monthLabel(k);
          frag.append(m);
        }
        const li = document.createElement('li');
        li.className = 'day' + (k === today ? ' today' : '');
        const date = document.createElement('span');
        date.className = 'd';
        date.textContent = dayLabel(k);
        const times = document.createElement('span');
        times.className = 'times';
        const list = byDay.get(k) || [];
        if (list.length) {
          for (const e of list) {
            const pill = document.createElement('button');
            pill.type = 'button';
            pill.className = 'pill ' + e.kind;
            pill.dataset.id = e.id;
            pill.setAttribute('aria-label', `${NAME[e.kind]} at ${clock(e.at)}. Edit`);
            const dot = document.createElement('i');
            dot.className = 'dot ' + e.kind;
            dot.setAttribute('aria-hidden', 'true');
            pill.append(dot, clock(e.at));
            times.append(pill);
          }
        } else {
          const none = document.createElement('span');
          none.className = 'none';
          none.textContent = '—';
          times.append(none);
        }
        li.append(date, times);
        frag.append(li);
        if (k <= first) break;
        d.setDate(d.getDate() - 1);
      }
    }

    const active = document.activeElement;
    const focusId = active && active.classList && active.classList.contains('pill') ? active.dataset.id : null;
    els.days.replaceChildren(frag);
    if (focusId) {
      const again = els.days.querySelector(`.pill[data-id="${focusId}"]`);
      if (again) again.focus({ preventScroll: true });
    }
  }

  /* ---------- toast ---------- */

  let toastTimer = 0;
  function toast(message, undo) {
    els.toastMsg.textContent = message;
    els.undo.hidden = !undo;
    els.undo.onclick = undo ? () => { hideToast(); undo(); toast('Undone'); } : null;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 6000 : 2400);
  }
  function hideToast() {
    clearTimeout(toastTimer);
    els.toast.classList.remove('show');
  }

  /* ---------- tapping a tile ---------- */

  function logMeds(kind, tile) {
    const now = Date.now();
    const again = entries.some(e => e.kind === kind && dayKey(e.at) === dayKey(now));
    const before = snapshot();
    entries.push({ id: newId(), kind, at: now });
    tile.classList.remove('flash');
    void tile.offsetWidth;
    tile.classList.add('flash');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
    commit(`${TAKEN[kind]} logged ${again ? 'again ' : ''}at ${clock(now)}`, before);
  }

  /* ---------- changing an entry ---------- */

  let editing = null;
  let needsReload = false;   // a newer version arrived while a sheet was open

  // Reads a typed time: 740, 0740, 7:40, 07:40, 7.40, 7, and a trailing am/pm. Gives { h, m } or null.
  function parseTime(text) {
    let s = String(text || '').trim().toLowerCase();
    let ap = '';
    const suffix = s.match(/\s*([ap])\.?\s*m?\.?$/);
    if (suffix) { ap = suffix[1]; s = s.slice(0, suffix.index).trim(); }
    s = s.replace(/\s*:\s*/g, ':').replace(/[.\s]+/g, ':');
    let h, mi;
    if (s.includes(':')) {
      const parts = s.split(':');
      if (parts.length !== 2 || !/^\d{1,2}$/.test(parts[0]) || !/^\d{1,2}$/.test(parts[1])) return null;
      h = +parts[0]; mi = +parts[1];
    } else {
      if (!/^\d{1,4}$/.test(s)) return null;
      if (s.length <= 2) { h = +s; mi = 0; } else { h = +s.slice(0, -2); mi = +s.slice(-2); }
    }
    if (ap) {
      if (h < 1 || h > 12) return null;
      if (ap === 'p' && h < 12) h += 12;
      if (ap === 'a' && h === 12) h = 0;
    }
    if (h > 23 || mi > 59) return null;
    return { h, m: mi };
  }

  function dayName(k) {
    const today = dayKey(Date.now());
    if (k === today) return 'Today · ' + dayLabel(k);
    if (k === shiftKey(today, -1)) return 'Yesterday · ' + dayLabel(k);
    if (k === shiftKey(today, 1)) return 'Tomorrow · ' + dayLabel(k);
    return dayLabel(k);
  }
  // The last 60 days, tomorrow (so a time can be moved past midnight), and whichever day is being edited.
  function fillDays(selected) {
    const today = dayKey(Date.now());
    const set = new Set([selected]);
    for (let i = -1; i < 60; i++) set.add(shiftKey(today, -i));
    els.day.replaceChildren(...[...set].sort().reverse().map(k => {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = dayName(k);
      return o;
    }));
    els.day.value = selected;
  }

  // What the sheet currently says, as a real time. A time left as it was keeps its exact saved value, seconds and all.
  function readForm() {
    const date = els.day.value;
    const f = { date, kind: editing ? editing.kind : null, at: null, empty: false, bad: false };
    if (!editing || !isDate(date)) return f;
    const text = els.time.value.trim();
    if (!text) { f.empty = true; return f; }
    const t = parseTime(text);
    if (!t) { f.bad = true; return f; }
    const o = editing.orig;
    f.at = text === editing.timeText && date === dayKey(o.at) ? o.at : atTime(date, t.h, t.m);
    return f;
  }

  const tidyTime = () => {
    const t = parseTime(els.time.value);
    if (t) els.time.value = pad(t.h) + ':' + pad(t.m);
  };

  function paintSeg() {
    for (const b of els.seg) b.setAttribute('aria-checked', String(!!editing && b.dataset.kind === editing.kind));
    els.meds.textContent = editing ? `Records ${MEDS[editing.kind].join(' + ')}.` : '';
  }

  function validate() {
    if (!editing) return;
    const f = readForm();
    els.time.classList.toggle('bad', f.bad);
    let note = '';
    if (f.bad) note = "Couldn't read that time. Try 9:15, 915 or 3pm.";
    else if (f.empty) note = 'Add a time.';
    else if (f.at > Date.now()) note = "That time hasn't happened yet.";
    els.note.textContent = note;
    els.note.classList.toggle('warn', f.bad);
    for (const b of els.nudges) b.disabled = f.at == null;
    const o = editing.orig;
    const changed = f.at !== o.at || f.kind !== o.kind;
    els.save.disabled = !f.kind || !isDate(f.date) || f.at == null || !changed;
  }

  function openEdit(id) {
    const cur = entries.find(e => e.id === id);
    if (!cur) return;
    editing = { orig: { ...cur }, kind: cur.kind, timeText: clock(cur.at) };
    fillDays(dayKey(cur.at));
    els.time.value = editing.timeText;
    paintSeg();
    validate();
    if (!els.editSheet.open) els.editSheet.showModal();
  }

  els.editForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!editing) return;
    tidyTime();
    validate();
    if (els.save.disabled) return;
    const f = readForm();
    const { orig } = editing;
    const before = snapshot();
    const cur = entries.find(x => x.id === orig.id);
    if (cur) { cur.kind = f.kind; cur.at = f.at; }
    els.editSheet.close();
    commit(`Saved ${f.kind}, ${dayLabel(f.date)} ${clock(f.at)}`, before);
  });

  els.del.addEventListener('click', () => {
    if (!editing) return;
    const { orig } = editing;
    const before = snapshot();
    entries = entries.filter(x => x.id !== orig.id);
    els.editSheet.close();
    commit(`Deleted ${orig.kind}, ${dayLabel(dayKey(orig.at))} ${clock(orig.at)}`, before);
  });

  els.seg.forEach(b => b.addEventListener('click', () => {
    if (!editing) return;
    editing.kind = b.dataset.kind;
    paintSeg();
    validate();
  }));
  els.day.addEventListener('change', validate);
  els.cancel.addEventListener('click', () => els.editSheet.close());

  // Tapping the time selects it all, so typing replaces it. (Phones place the cursor after the tap, so select again on finger-up.)
  let typed = false;
  const selectTime = () => { if (!typed) { try { els.time.select(); } catch (_) {} } };
  els.time.addEventListener('focus', () => { typed = false; setTimeout(selectTime, 0); });
  els.time.addEventListener('pointerup', () => setTimeout(selectTime, 0));
  els.time.addEventListener('input', () => { typed = true; validate(); });
  els.time.addEventListener('blur', () => { tidyTime(); validate(); });

  // A nudge moves the day too when it crosses midnight.
  for (const b of els.nudges) {
    b.addEventListener('click', () => {
      const f = readForm();
      if (f.at == null) return;
      const next = f.at + Number(b.dataset.min) * MIN;
      fillDays(dayKey(next));
      els.time.value = clock(next);
      validate();
    });
  }

  /* ---------- copying the log out ---------- */

  // Local time with its offset, so a time reads the same whatever the clocks do.
  function stamp(t) {
    const d = new Date(t);
    const off = -d.getTimezoneOffset(), a = Math.abs(off);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
      (off < 0 ? '-' : '+') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
  }
  const csvField = s => (/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
  // One row per medicine taken: a morning tap is a lamotrigine row and a concerta row at the same time.
  function csvRows() {
    const rows = [];
    for (const e of [...entries].sort(byTime)) {
      for (const med of MEDS[e.kind]) rows.push({ id: e.id + '-' + med, at: e.at, med, slot: SLOT[e.kind] });
    }
    return rows;
  }
  const buildCsv = rows => 'id,time,med,slot\n' +
    rows.map(r => [csvField(r.id), stamp(r.at), r.med, r.slot].join(',')).join('\n') + '\n';

  els.copy.addEventListener('click', async () => {
    sync();
    const rows = csvRows();
    if (!rows.length) { toast('Nothing to copy yet'); return; }
    const text = buildCsv(rows);
    const n = rows.length;
    try {
      await navigator.clipboard.writeText(text);
      toast('Copied ' + n + (n === 1 ? ' dose' : ' doses') + ' as CSV');
    } catch (_) {
      // Some browsers won't write to the clipboard: show the text so it can be copied by hand.
      els.csvText.value = text;
      if (!els.csvSheet.open) els.csvSheet.showModal();
      els.csvText.focus();
      els.csvText.select();
    }
  });
  els.csvClose.addEventListener('click', () => els.csvSheet.close());

  /* ---------- wiring ---------- */

  els.tiles.forEach(t => t.addEventListener('click', () => logMeds(t.dataset.kind, t)));
  els.tiles.forEach(t => t.addEventListener('animationend', () => t.classList.remove('flash')));
  els.days.addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if (pill) openEdit(pill.dataset.id);
  });

  for (const sheet of [els.editSheet, els.csvSheet]) {
    sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
    sheet.addEventListener('close', () => {
      if (sheet === els.editSheet) editing = null;
      if (needsReload) location.reload();
    });
  }

  // ---------- sending the log to the Tracking log sheet ----------
  // Off until the setup link (…/#log=<web app address>&key=<key>) has been opened in any tracker on this site.
  // Every change sends the whole log, so edits and deletes reach the sheet too. A send that
  // fails (no signal) is repeated when the app is next opened or comes back online.
  const LINK = 'tracking-log.link.v1';   // one setting for every tracker on this site
  const UNSENT = KEY + '.unsent';
  const SENT_ONCE = KEY + '.sent-once';  // until the first send, the whole existing log still needs to go
  const SOURCE = 'meds_app';
  const okUrl = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) ||
    /^http:\/\/(localhost|127\.0\.0\.1):\d+\/[\w/-]*$/.test(u);

  function link() {
    try {
      const v = JSON.parse(localStorage.getItem(LINK) || 'null');
      if (v && typeof v.url === 'string' && okUrl(v.url) && typeof v.key === 'string' && v.key) return v;
    } catch (_) {}
    return null;
  }
  const unsent = () => { try { return localStorage.getItem(UNSENT) === '1'; } catch (_) { return false; } };
  const setUnsent = on => { try { if (on) localStorage.setItem(UNSENT, '1'); else localStorage.removeItem(UNSENT); } catch (_) {} };

  const SHEET_LABELS = { sent: 'synced', sending: 'syncing…', waiting: 'not synced yet', paused: 'sync paused', error: 'sync error' };
  let sheetState = '';
  function setSheet(state, note) {
    const was = sheetState;
    sheetState = state;
    const on = !!link() && !!SHEET_LABELS[state];
    els.sheetSync.hidden = !on;
    els.sheetSync.textContent = on ? SHEET_LABELS[state] : '';
    els.sheetSync.title = note || '';
    els.sheetSync.classList.toggle('warn', state === 'paused' || state === 'error');
    if ((state === 'paused' || state === 'error') && state !== was) toast('Sheet: ' + (note || SHEET_LABELS[state]), null, 6000);
  }

  function callSheet(cfg, body) {
    // A plain-text body keeps this a simple request, which Google's web apps accept from another site.
    return fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: cfg.key }, body)) })
      .then(res => res.json());
  }

  let sending = false, sendAgain = false, sendTimer = 0;
  function queueSend(ms) { clearTimeout(sendTimer); sendTimer = setTimeout(sendLog, ms); }

  function changed() {
    setUnsent(true);
    // A send already on its way was built before this change, so make sure another one follows it.
    // Without this, an answer arriving within 1.2s of the change marked it as sent when it wasn't.
    if (link()) { if (sending) sendAgain = true; setSheet('waiting'); queueSend(1200); }
  }

  // One row per entry in the sheet's format: id, time, what, value (and note).
  function sheetRows() {
    return entries.map(e => ({ id: e.id, time: stamp(e.at), what: 'meds', value: e.kind }));
  }

  async function sendLog() {
    const cfg = link();
    if (!cfg) { setSheet(''); return; }
    if (sending) { sendAgain = true; return; }
    if (!unsent()) { setSheet('sent'); return; }
    sending = true;
    sendAgain = false;
    setSheet('sending');
    sync();
    let res = null;
    try { res = await callSheet(cfg, { source: SOURCE, rows: sheetRows() }); } catch (_) {}
    sending = false;
    if (res && res.ok) {
      if (!sendAgain) setUnsent(false);
      try { localStorage.setItem(SENT_ONCE, '1'); } catch (_) {}
      setSheet('sent');
    } else if (res && res.code === 'shrink') {
      setSheet('paused', res.error);
    } else if (res) {
      setSheet('error', res.error || 'it said no');
    } else {
      setSheet('waiting');
    }
    if (sendAgain) queueSend(300);
  }
  const sendIfNeeded = () => { if (link() && unsent()) queueSend(0); };

  // The setup link: saves where to send, checks the sheet answers, then sends what's already here.
  function setupFromLink() {
    const h = new URLSearchParams(location.hash.slice(1));
    const url = h.get('log'), key = h.get('key');
    if (!url && !key) return false;
    history.replaceState(null, '', location.pathname + location.search);
    if (!url || !key || !okUrl(url)) { toast('That setup link doesn’t look right', null, 5000); return true; }
    try { localStorage.setItem(LINK, JSON.stringify({ url, key })); }
    catch (_) { toast('Couldn’t save the sync setting in this browser', null, 5000); return true; }
    setUnsent(true);
    setSheet('sending');
    callSheet({ url, key }, { ping: true }).then(res => {
      if (res && res.ok) {
        toast('Sync is on: meds entries now go to the sheet', null, 4000);
        sendIfNeeded();
      } else {
        setSheet('error', (res && res.error) || 'no answer');
      }
    }).catch(() => {
      // Online but no readable answer usually means the web app isn't shared with Anyone.
      if (navigator.onLine) setSheet('error', 'couldn’t reach the sheet: check the web app’s access is set to Anyone');
      else setSheet('waiting');
    });
    return true;
  }
  function startSheet() {
    if (setupFromLink() || !link()) return;
    try { if (localStorage.getItem(SENT_ONCE) !== '1') setUnsent(true); } catch (_) {}
    if (unsent()) queueSend(0); else setSheet('sent');
  }

  window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) { sync(); render(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); render(); sendIfNeeded(); } });
  window.addEventListener('online', sendIfNeeded);
  window.addEventListener('hashchange', setupFromLink);   // the setup link tapped while the app is already open
  setInterval(render, 60000);
  render();
  startSheet();

  if ('serviceWorker' in navigator) {
    // When a newer version of the page takes over, reload once so it shows up without any effort.
    const hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadWorker) return;
      if (els.editSheet.open || els.csvSheet.open) needsReload = true; else location.reload();
    });
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
