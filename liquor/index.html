<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Liquor Log</title>
<meta name="theme-color" content="#F2EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@400..700,0..1,0..1&display=swap">
<style>
/* Layout: three big tiles (beer, wine, spirits) on top; a day-by-day docket of tappable entries underneath. */
:root {
  color-scheme: light dark;
  --ground: #F2EFEA;   /* paper */
  --ink: #2D2926;
  --muted: #6B645E;
  --rule: #E0DBD3;
  --beer: #F2E0A6;     /* pale ale */
  --beer-ink: #6E5210;
  --wine: #EBCDD4;     /* rosé */
  --wine-ink: #6B2A3B;
  --spirits: #D0E0DA;  /* clear glass, a little green */
  --spirits-ink: #2F5951;
  --sheet: #FAF8F5;
  --scrim: rgba(34, 28, 24, .34);
  --danger: #A0443A;
  --font-ui: "Recursive", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-time: "Recursive", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #181514; --ink: #E8E3DD; --muted: #958D85; --rule: #2A2624;
    --beer: #3B3218; --beer-ink: #EDCB74;
    --wine: #3B2229; --wine-ink: #E8A9B8;
    --spirits: #1F3430; --spirits-ink: #9FD0C4;
    --sheet: #221E1C; --scrim: rgba(0, 0, 0, .55); --danger: #E68B7F;
  }
}

html { background: var(--ground); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-variation-settings: "CASL" 1, "MONO" 0;
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 24px;
}

/* icons: one set of line drawings, drawn once in the sprite and reused */
.ico {
  display: inline-block;
  flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.ico.sm { width: 16px; height: 16px; stroke-width: 2; }
.ico.md { width: 22px; height: 22px; stroke-width: 1.9; }
.ico.xl { width: 52px; height: 52px; }
.beer { --k: var(--beer); --k-ink: var(--beer-ink); }
.wine { --k: var(--wine); --k-ink: var(--wine-ink); }
.spirits { --k: var(--spirits); --k-ink: var(--spirits-ink); }

/* the three buttons */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile {
  appearance: none;
  border: 0;
  border-radius: 26px;
  height: clamp(150px, 28vh, 230px);
  display: grid;
  place-items: center;
  align-content: center;
  gap: 12px;
  padding: 0;
  background: var(--k);
  color: var(--k-ink);
  font: inherit;
  font-size: 18px;
  font-weight: 620;
  letter-spacing: .01em;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .12s ease;
  user-select: none;
  -webkit-user-select: none;
}
.tile:active { transform: scale(.97); }
.tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tile.flash { animation: flash .6s ease-out; }
@keyframes flash { from { filter: brightness(1.1) saturate(1.2); } to { filter: none; } }

/* the log */
.log-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
  color: var(--muted);
}
.log-head .name { color: var(--ink); font-weight: 650; letter-spacing: .02em; }
.status { color: var(--muted); font-weight: 450; }
.status::before { content: "· "; }
.legend { display: flex; gap: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .ico { color: var(--k-ink); }

.days { list-style: none; margin: 0; padding: 0; }
.month {
  padding-block: 18px 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.month:first-child { padding-top: 8px; }
.day {
  display: grid;
  grid-template-columns: 5.7em 1fr;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding-block: 6px;
  border-bottom: 1px solid var(--rule);
}
.date { font-size: 14px; color: var(--muted); white-space: nowrap; }
.day.today .date { color: var(--ink); font-weight: 650; }
.drinks { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.none { color: var(--muted); padding-left: 4px; }
.chip {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 6px 10px 6px 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--k);
  font-family: var(--font-time);
  font-variation-settings: "MONO" 1, "CASL" 1;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.chip .ico { color: var(--k-ink); }
.chip .n { color: var(--k-ink); font-weight: 750; }
.chip:active { transform: scale(.95); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip.new { animation: pop .38s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

.empty { margin: 0; padding-top: 14px; max-width: 38ch; font-size: 14px; color: var(--muted); }

/* edit sheet */
.sheet {
  border: 0;
  padding: 0;
  margin: auto auto 0;
  width: 100%;
  max-width: 520px;
  max-height: 100%;
  box-sizing: border-box;
  border-radius: 26px 26px 0 0;
  background: var(--sheet);
  color: var(--ink);
}
.sheet::backdrop { background: var(--scrim); }
.sheet[open] { animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.edit {
  display: grid;
  gap: 18px;
  padding: 22px 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.edit h2 { margin: 0; font-size: 18px; font-weight: 650; outline: none; }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  height: 50px;
  border-radius: 16px;
  border: 1.5px solid var(--rule);
  font-weight: 600;
  cursor: pointer;
}
.seg label .ico { color: var(--k-ink); }
.seg input:checked + label { background: var(--k); border-color: var(--k); color: var(--k-ink); }
.seg input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
.field { display: grid; gap: 6px; min-width: 0; font-size: 13px; color: var(--muted); }
.field input, .field select {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  height: 50px;
  padding: 0 12px;
  border: 1.5px solid var(--rule);
  border-radius: 14px;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-time);
  font-variation-settings: "MONO" 1, "CASL" 1;
  font-size: 16px;
}
.field select { font-family: var(--font-ui); font-variation-settings: "CASL" 1, "MONO" 0; }
.field input:focus-visible, .field select:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.field input.bad { border-color: var(--danger); }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
.stepper button {
  appearance: none;
  height: 50px;
  padding: 0;
  border: 1.5px solid var(--rule);
  border-radius: 14px;
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}
.stepper button:active { transform: scale(.95); background: var(--rule); }
.stepper button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.field .stepper input { text-align: center; font-size: 22px; font-weight: 650; }
.nudge { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.nudge button {
  appearance: none;
  height: 40px;
  padding: 0;
  border: 1.5px solid var(--rule);
  border-radius: 12px;
  background: none;
  color: var(--ink);
  font-family: var(--font-time);
  font-variation-settings: "MONO" 1, "CASL" 1;
  font-size: 13px;
  cursor: pointer;
  touch-action: manipulation;
}
.nudge button:active { transform: scale(.95); background: var(--rule); }
.nudge button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.actions { display: flex; align-items: center; gap: 6px; }
.actions .spacer { flex: 1; }
.text-btn, .solid-btn {
  appearance: none;
  border: 0;
  font: inherit;
  font-weight: 620;
  border-radius: 14px;
  cursor: pointer;
}
.text-btn { background: none; color: var(--muted); padding: 12px 12px; }
.text-btn.danger { color: var(--danger); padding-left: 4px; }
.solid-btn { background: var(--ink); color: var(--ground); padding: 12px 24px; }
.text-btn:focus-visible, .solid-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 488px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px 10px 16px;
  min-height: 48px;
  border-radius: 16px;
  background: var(--ink);
  color: var(--ground);
  font-size: 15px;
  z-index: 5;
}
.toast[hidden] { display: none; }
.toast.rise { animation: rise .2s ease-out; }
@keyframes rise { from { transform: translate(-50%, 10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.toast .msg { min-width: 0; }
.toast button {
  margin-left: auto;
  appearance: none;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 10px;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.toast button:focus-visible { outline: 2px solid var(--ground); outline-offset: 1px; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-beer" viewBox="0 0 24 24">
    <path d="M6 8.5h9V19a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/>
    <path d="M15 10.5h2a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-2"/>
    <path d="M6 8.5V7.4a2 2 0 0 1 2-2 2.6 2.6 0 0 1 4.4-.8A2 2 0 0 1 15 6.6v1.9"/>
    <path d="M9.2 12v4.5"/><path d="M11.8 12v4.5"/>
  </symbol>
  <symbol id="i-wine" viewBox="0 0 24 24">
    <path d="M8 3.5h8l.4 4.6a4.4 4.4 0 0 1-8.8 0z"/>
    <path d="M7.7 8.4h8.6"/>
    <path d="M12 12.5V20"/>
    <path d="M8.6 20h6.8"/>
  </symbol>
  <symbol id="i-spirits" viewBox="0 0 24 24">
    <path d="M5.8 4.5h12.4l-1.4 14.6a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9z"/>
    <path d="M6.7 10.5h10.6"/>
    <path d="M9.8 13.2h3.3v3.2H9.8z"/>
  </symbol>
</svg>

<main class="wrap">
  <section class="tiles" aria-label="Log a drink">
    <button type="button" class="tile beer" id="log-beer" aria-label="Log a beer now">
      <svg class="ico xl" aria-hidden="true"><use href="#i-beer"/></svg>
      <span>beer</span>
    </button>
    <button type="button" class="tile wine" id="log-wine" aria-label="Log a wine now">
      <svg class="ico xl" aria-hidden="true"><use href="#i-wine"/></svg>
      <span>wine</span>
    </button>
    <button type="button" class="tile spirits" id="log-spirits" aria-label="Log a spirit now">
      <svg class="ico xl" aria-hidden="true"><use href="#i-spirits"/></svg>
      <span>spirits</span>
    </button>
  </section>

  <section class="log" aria-label="Drink log">
    <div class="log-head">
      <div><span class="name">liquor log</span> <span class="status" id="status" hidden></span></div>
      <div class="legend" aria-label="Key">
        <span class="beer"><svg class="ico sm" aria-hidden="true"><use href="#i-beer"/></svg>beer</span>
        <span class="wine"><svg class="ico sm" aria-hidden="true"><use href="#i-wine"/></svg>wine</span>
        <span class="spirits"><svg class="ico sm" aria-hidden="true"><use href="#i-spirits"/></svg>spirits</span>
      </div>
    </div>
    <ul class="days" id="days"></ul>
    <p class="empty" id="empty">Tap beer, wine or spirits each time you have a drink. It logs one. Had more? Tap its time, then change the number.</p>
  </section>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <form class="edit" id="edit-form" novalidate>
    <h2 id="sheet-title" tabindex="-1" autofocus>Edit drink</h2>
    <div class="seg" role="radiogroup" aria-label="Type of drink">
      <input type="radio" name="kind" id="kind-beer" value="beer">
      <label for="kind-beer" class="beer"><svg class="ico md" aria-hidden="true"><use href="#i-beer"/></svg>beer</label>
      <input type="radio" name="kind" id="kind-wine" value="wine">
      <label for="kind-wine" class="wine"><svg class="ico md" aria-hidden="true"><use href="#i-wine"/></svg>wine</label>
      <input type="radio" name="kind" id="kind-spirits" value="spirits">
      <label for="kind-spirits" class="spirits"><svg class="ico md" aria-hidden="true"><use href="#i-spirits"/></svg>spirits</label>
    </div>
    <div class="field">
      <span id="count-label">How many</span>
      <div class="stepper">
        <button type="button" id="count-minus" aria-label="One fewer">−</button>
        <input type="text" id="edit-count" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="2" aria-labelledby="count-label" placeholder="1">
        <button type="button" id="count-plus" aria-label="One more">+</button>
      </div>
    </div>
    <div class="fields">
      <label class="field" for="edit-day"><span>Day</span><select id="edit-day"></select></label>
      <label class="field" for="edit-time"><span>Time, 24h</span><input type="text" id="edit-time" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="8" placeholder="19:40"></label>
    </div>
    <div class="nudge" role="group" aria-label="Shift the time">
      <button type="button" data-min="-60">−1h</button>
      <button type="button" data-min="-30">−30m</button>
      <button type="button" data-min="-15">−15m</button>
      <button type="button" data-min="15">+15m</button>
      <button type="button" data-min="30">+30m</button>
      <button type="button" data-min="60">+1h</button>
    </div>
    <div class="actions">
      <button type="button" class="text-btn danger" id="edit-delete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="text-btn" id="edit-cancel">Cancel</button>
      <button type="submit" class="solid-btn" id="edit-save">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="msg" id="toast-msg"></span>
  <button type="button" id="toast-undo">Undo</button>
</div>

<script>
(() => {
  'use strict';

  const KEY = 'liquor-log.v1';
  const KINDS = ['beer', 'wine', 'spirits'];
  const MAX_COUNT = 99;

  const $ = id => document.getElementById(id);
  const els = {
    days: $('days'), empty: $('empty'), status: $('status'),
    sheet: $('sheet'), form: $('edit-form'), day: $('edit-day'), time: $('edit-time'),
    count: $('edit-count'), minus: $('count-minus'), plus: $('count-plus'),
    del: $('edit-delete'), cancel: $('edit-cancel'),
    toast: $('toast'), toastMsg: $('toast-msg'), undo: $('toast-undo'),
  };

  const pad = n => String(n).padStart(2, '0');
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const clock = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const fromKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dayLabel = k => { const d = fromKey(k); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; };
  const monthLabel = k => { const d = fromKey(k); return MO[d.getMonth()] + ' ' + d.getFullYear(); };
  const kindName = k => k.charAt(0).toUpperCase() + k.slice(1);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clampCount = n => Math.min(MAX_COUNT, Math.max(1, n));

  const isDrink = c => !!c && typeof c.id === 'string' && c.id.length > 0 &&
    KINDS.includes(c.kind) && Number.isFinite(c.at);
  const countOf = c => (Number.isInteger(c.n) && c.n >= 1 ? clampCount(c.n) : 1);

  // ---------- saving: the log lives in this browser's storage on this phone ----------
  let canSave = true;

  function read() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (_) { canSave = false; return []; }
    if (!raw) return [];
    try {
      const list = JSON.parse(raw);
      if (Array.isArray(list)) {
        return list.filter(isDrink).map(c => ({ id: c.id, kind: c.kind, at: c.at, n: countOf(c) })).sort((a, b) => a.at - b.at);
      }
    } catch (_) {}
    // Unreadable: keep the raw text aside instead of letting the next save overwrite it.
    try { localStorage.setItem(KEY + '.unreadable', raw); } catch (_) {}
    return [];
  }

  let drinks = read();

  function write() {
    try { localStorage.setItem(KEY, JSON.stringify(drinks)); canSave = true; }
    catch (_) { canSave = false; }
    renderStatus();
  }

  // Pick up changes made in another tab, without dropping anything that failed to save here.
  function sync() {
    const fresh = read();
    if (canSave) drinks = fresh;
  }

  // Ask the browser not to clear this data when the phone is short on space.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}

  function put(e) {
    drinks = drinks.filter(c => c.id !== e.id);
    drinks.push({ id: e.id, kind: e.kind, at: e.at, n: e.n });
    drinks.sort((a, b) => a.at - b.at);
    write();
    render();
  }
  function del(id) {
    drinks = drinks.filter(c => c.id !== id);
    write();
    render();
  }

  // ---------- drawing the log ----------
  let freshId = null, lastSig = '';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function icon(kind, size) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'ico ' + size);
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#i-' + kind);
    svg.append(use);
    return svg;
  }

  function monthRow(k) {
    const li = document.createElement('li');
    li.className = 'month';
    li.textContent = monthLabel(k);
    return li;
  }
  function dayRow(k, list, isToday) {
    const li = document.createElement('li');
    li.className = isToday ? 'day today' : 'day';
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = dayLabel(k);
    const box = document.createElement('span');
    box.className = 'drinks';
    if (list.length) {
      for (const c of list) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip ' + c.kind + (c.id === freshId ? ' new' : '');
        b.dataset.id = c.id;
        b.setAttribute('aria-label', kindName(c.kind) + (c.n > 1 ? ', ' + c.n + ' drinks' : '') + ' at ' + clock(c.at) + ', ' + dayLabel(k) + '. Edit');
        b.append(icon(c.kind, 'sm'), clock(c.at));
        if (c.n > 1) {
          const n = document.createElement('span');
          n.className = 'n';
          n.textContent = '×' + c.n;
          b.append(n);
        }
        box.append(b);
      }
    } else {
      const none = document.createElement('span');
      none.className = 'none';
      none.textContent = '—';
      box.append(none);
    }
    li.append(date, box);
    return li;
  }

  function renderStatus() {
    els.status.textContent = canSave ? '' : 'can’t save in this browser';
    els.status.hidden = canSave;
  }

  function render() {
    const byDay = new Map();
    for (const c of drinks) {
      const k = dayKey(c.at);
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(c);
    }
    const today = dayKey(Date.now());
    const signature = today + '|' + drinks.map(c => c.id + c.kind + c.at + 'x' + c.n).join(',');
    if (signature !== lastSig) {
      lastSig = signature;
      const keys = [...byDay.keys()].sort();
      const top = keys.length && keys[keys.length - 1] > today ? keys[keys.length - 1] : today;
      const bottom = keys.length && keys[0] < today ? keys[0] : today;
      const frag = document.createDocumentFragment();
      const d = fromKey(top);
      let lastMonth = '';
      for (let i = 0; i < 5000; i++) {
        const k = dayKey(d.getTime());
        if (k.slice(0, 7) !== lastMonth) { lastMonth = k.slice(0, 7); frag.append(monthRow(k)); }
        frag.append(dayRow(k, byDay.get(k) || [], k === today));
        if (k <= bottom) break;
        d.setDate(d.getDate() - 1);
      }
      els.days.replaceChildren(frag);
      els.empty.hidden = byDay.size > 0;
      freshId = null;
    }
    renderStatus();
  }

  // ---------- toast ----------
  let toastTimer = 0;
  let undoFn = null;
  function toast(msg, undo, ms) {
    els.toastMsg.textContent = msg;
    undoFn = undo || null;
    els.undo.hidden = !undoFn;
    els.toast.hidden = false;
    els.toast.classList.remove('rise');
    void els.toast.offsetWidth;
    els.toast.classList.add('rise');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, ms || (undoFn ? 5000 : 2600));
  }
  function hideToast() {
    clearTimeout(toastTimer);
    els.toast.hidden = true;
    undoFn = null;
  }
  els.undo.addEventListener('click', () => {
    const f = undoFn;
    hideToast();
    if (f) { f(); toast('Undone', null, 1600); }
  });

  // ---------- logging: one tap = one drink, right now ----------
  function logDrink(kind, btn) {
    const e = { id: newId(), kind, at: Date.now(), n: 1 };
    freshId = e.id;
    put(e);
    btn.classList.remove('flash');
    void btn.offsetWidth;
    btn.classList.add('flash');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
    toast(kindName(kind) + ' logged at ' + clock(e.at), () => del(e.id));
  }
  for (const kind of KINDS) {
    const btn = $('log-' + kind);
    btn.addEventListener('click', () => logDrink(kind, btn));
  }

  // ---------- editing ----------
  const MIN = 60000;
  let needsReload = false;   // a newer version arrived while the edit sheet was open

  // Reads a typed time: 740, 0740, 7:40, 07:40, 7.40, 7, and a trailing am/pm. Gives { h, m } or null.
  function parseTime(text) {
    let s = String(text || '').trim().toLowerCase();
    let ap = '';
    const suffix = s.match(/\s*([ap])\.?\s*m?\.?$/);
    if (suffix) { ap = suffix[1]; s = s.slice(0, suffix.index).trim(); }
    s = s.replace(/\s*:\s*/g, ':').replace(/[.\s]+/g, ':');
    let h, mi;
    if (s.includes(':')) {
      const parts = s.split(':');
      if (parts.length !== 2 || !/^\d{1,2}$/.test(parts[0]) || !/^\d{1,2}$/.test(parts[1])) return null;
      h = +parts[0]; mi = +parts[1];
    } else {
      if (!/^\d{1,4}$/.test(s)) return null;
      if (s.length <= 2) { h = +s; mi = 0; } else { h = +s.slice(0, -2); mi = +s.slice(-2); }
    }
    if (ap) {
      if (h < 1 || h > 12) return null;
      if (ap === 'p' && h < 12) h += 12;
      if (ap === 'a' && h === 12) h = 0;
    }
    if (h > 23 || mi > 59) return null;
    return { h, m: mi };
  }

  // Reads the count box: a whole number from 1 to 99, or null.
  function parseCount(text) {
    const s = String(text || '').trim();
    if (!/^\d{1,2}$/.test(s)) return null;
    const n = +s;
    return n >= 1 && n <= MAX_COUNT ? n : null;
  }

  const keyShift = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); };
  function dayName(k) {
    const today = dayKey(Date.now());
    if (k === today) return 'Today · ' + dayLabel(k);
    if (k === keyShift(today, -1)) return 'Yesterday · ' + dayLabel(k);
    if (k === keyShift(today, 1)) return 'Tomorrow · ' + dayLabel(k);
    return dayLabel(k);
  }
  // The last 30 days, plus tomorrow, plus whichever day this entry is on.
  function fillDays(selected) {
    const today = dayKey(Date.now());
    const set = new Set([selected]);
    for (let i = -1; i <= 30; i++) set.add(keyShift(today, -i));
    els.day.replaceChildren(...[...set].sort().reverse().map(k => {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = dayName(k);
      return o;
    }));
    els.day.value = selected;
  }
  function fieldAt() {
    const t = parseTime(els.time.value);
    if (!t || !els.day.value) return null;
    const p = els.day.value.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2], t.h, t.m).getTime();
  }
  function setFields(at) {
    fillDays(dayKey(at));
    els.time.value = clock(at);
    els.time.classList.remove('bad');
  }
  function setCount(n) {
    els.count.value = String(n);
    els.count.classList.remove('bad');
  }

  let editing = null;
  function openEdit(id) {
    const c = drinks.find(x => x.id === id);
    if (!c) return;
    editing = { id: c.id, kind: c.kind, at: c.at, n: c.n };
    document.getElementById('kind-' + c.kind).checked = true;
    setCount(c.n);
    setFields(c.at);
    if (!els.sheet.open) els.sheet.showModal();
  }
  function closeSheet() { if (els.sheet.open) els.sheet.close(); }

  els.days.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) openEdit(chip.dataset.id);
  });
  els.sheet.addEventListener('click', e => { if (e.target === els.sheet) closeSheet(); });
  els.sheet.addEventListener('close', () => { editing = null; if (needsReload) location.reload(); });
  els.cancel.addEventListener('click', closeSheet);

  // The count: − and + step it, or type it. Tapping the box selects it all, so typing replaces it.
  function stepCount(by) {
    const now = parseCount(els.count.value) ?? (editing ? editing.n : 1);
    setCount(clampCount(now + by));
  }
  els.minus.addEventListener('click', () => stepCount(-1));
  els.plus.addEventListener('click', () => stepCount(1));
  let countTyped = false;
  const selectCount = () => { if (!countTyped) { try { els.count.select(); } catch (_) {} } };
  els.count.addEventListener('focus', () => { countTyped = false; setTimeout(selectCount, 0); });
  els.count.addEventListener('pointerup', () => setTimeout(selectCount, 0));
  els.count.addEventListener('input', () => { countTyped = true; els.count.classList.remove('bad'); });
  els.count.addEventListener('blur', () => {
    const n = parseCount(els.count.value);
    if (n) els.count.value = String(n);
  });

  // Tapping the time selects it all, so typing replaces it. (Phones place the cursor after the tap, so select again on finger-up.)
  let timeTyped = false;
  const selectTime = () => { if (!timeTyped) { try { els.time.select(); } catch (_) {} } };
  els.time.addEventListener('focus', () => { timeTyped = false; setTimeout(selectTime, 0); });
  els.time.addEventListener('pointerup', () => setTimeout(selectTime, 0));
  els.time.addEventListener('input', () => { timeTyped = true; els.time.classList.remove('bad'); });
  els.time.addEventListener('blur', () => {
    const t = parseTime(els.time.value);
    if (t) els.time.value = pad(t.h) + ':' + pad(t.m);
  });
  for (const b of document.querySelectorAll('.nudge button')) {
    b.addEventListener('click', () => {
      const base = fieldAt() ?? (editing && editing.at);
      if (base == null) return;
      setFields(base + Number(b.dataset.min) * MIN);
    });
  }

  els.form.addEventListener('submit', e => {
    e.preventDefault();
    const prev = editing;
    if (!prev) { closeSheet(); return; }
    const t = parseTime(els.time.value);
    const n = parseCount(els.count.value);
    const dk = els.day.value;
    els.time.classList.toggle('bad', !t);
    els.count.classList.toggle('bad', !n);
    if (!t || !n || !/^\d{4}-\d{2}-\d{2}$/.test(dk)) return;
    const kind = els.form.elements.kind.value || prev.kind;
    const p = dk.split('-').map(Number);
    const unchanged = dk === dayKey(prev.at) && pad(t.h) + ':' + pad(t.m) === clock(prev.at);
    const at = unchanged ? prev.at : new Date(p[0], p[1] - 1, p[2], t.h, t.m).getTime();
    closeSheet();
    if (kind === prev.kind && at === prev.at && n === prev.n) return;
    put({ id: prev.id, kind, at, n });
    toast('Updated', () => put(prev));
  });

  els.del.addEventListener('click', () => {
    const prev = editing;
    if (!prev) return;
    closeSheet();
    del(prev.id);
    toast('Deleted', () => put(prev));
  });

  // ---------- start ----------
  window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) { sync(); render(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); render(); } });
  setInterval(render, 60000);
  render();

  if ('serviceWorker' in navigator) {
    // When a newer version of the page takes over, reload once so it shows up without any effort.
    const hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadWorker) return;
      if (els.sheet.open) needsReload = true; else location.reload();
    });
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
