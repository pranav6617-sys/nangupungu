<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sleep Log</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
<style>
:root {
  --bg: #ffffff;
  --text: #37352f;
  --text-2: #73726e;
  --text-3: #9b9a97;
  --line: rgba(55, 53, 47, 0.09);
  --ring: rgba(55, 53, 47, 0.16);
  --hover: rgba(55, 53, 47, 0.08);
  --seg: rgba(55, 53, 47, 0.06);
  --fill: #f7f6f5;
  --callout: #f7f6f3;
  --accent: #2383e2;
  --accent-ring: rgba(35, 131, 226, 0.35);
  --danger: #c4443b;
  --gray-bg: #e3e2e0; --gray-fg: #32302c;
  --r1-bg: #ffe2dd; --r1-fg: #5d1715; --r1-ring: rgba(93, 23, 21, 0.4);
  --r2-bg: #fadec9; --r2-fg: #49290e; --r2-ring: rgba(73, 41, 14, 0.4);
  --r3-bg: #fdecc8; --r3-fg: #402c1b; --r3-ring: rgba(64, 44, 27, 0.4);
  --r4-bg: #dbeddb; --r4-fg: #1c3829; --r4-ring: rgba(28, 56, 41, 0.4);
  --r5-bg: #d3e5ef; --r5-fg: #183347; --r5-ring: rgba(24, 51, 71, 0.4);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* One centred column. The side gutter sits on each band's inner wrapper. */
.col {
  width: 100%;
  max-width: 640px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px));
  margin-bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
}

/* Page title and what the numbers mean */
.head { padding-block: 40px 0; }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.titlerow .btn { margin-right: -10px; }
h1 { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700; }
.sub { margin: 2px 0 0; font-size: 14px; line-height: 20px; color: var(--text-2); }
.sync::before { content: "· "; }
.sync.warn { color: var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 5px; margin: 12px 0 0; padding: 0; list-style: none; }
.legend .tag { padding: 0 5px; }

.tag {
  display: inline-block; padding: 0 6px; border-radius: 3px;
  font-size: 13px; line-height: 20px; white-space: nowrap;
}
.tag.slot { background: var(--gray-bg); color: var(--gray-fg); }
.r1 { background: var(--r1-bg); color: var(--r1-fg); }
.r2 { background: var(--r2-bg); color: var(--r2-fg); }
.r3 { background: var(--r3-bg); color: var(--r3-fg); }
.r4 { background: var(--r4-bg); color: var(--r4-fg); }
.r5 { background: var(--r5-bg); color: var(--r5-fg); }

.btn {
  min-height: 34px; padding: 0 10px; margin: 0;
  border: 0; border-radius: 4px; background: transparent;
  font-size: 14px; line-height: 20px; color: var(--text-2);
  white-space: nowrap; cursor: pointer;
}
.btn:disabled { color: var(--text-3); cursor: default; }
@media (hover: hover) { .btn:not(:disabled):hover { background: var(--hover); } }
.btn.solid { box-shadow: inset 0 0 0 1px var(--ring); color: var(--text); }
:is(button, input, textarea, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.callout {
  display: flex; align-items: flex-start; gap: 10px; margin: 0;
  padding: 12px 14px; border-radius: 4px; background: var(--callout);
  font-size: 15px; line-height: 1.5;
}
.callout > svg { flex: none; margin-top: 3px; color: var(--text-2); }
.callout p { flex: 1; min-width: 0; margin: 0; }
.stack { display: grid; gap: 10px; margin-top: 16px; }
.csvbox { flex: 1; min-width: 0; display: grid; gap: 8px; font-size: 14px; }
.csvbox p { margin: 0; color: var(--text-2); }
.csvbox textarea {
  width: 100%; min-width: 0; padding: 8px; resize: vertical;
  font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--bg); border: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--ring);
}
.csvbox .btn { justify-self: start; }

/* The log: oldest night first, newest just above the composer */
.log { flex: 1; padding-block: 8px 24px; }
.quiet { margin: 24px 0 0; color: var(--text-2); }
.more { display: block; margin: 16px 0 0 -10px; }
.day { margin-top: 28px; }
.day h2 {
  display: flex; align-items: center; gap: 8px; margin: 0; padding-bottom: 6px;
  border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px; font-weight: 600;
}
.day h2 .dd { font-weight: 400; color: var(--text-2); }
.day ul { list-style: none; margin: 0; padding: 0; }
.day li + li { border-top: 1px solid var(--line); }
/* Each entry is a button: tap it to change it. */
.row {
  display: block; width: calc(100% + 12px); margin: 0 -6px; padding: 10px 6px 12px;
  border: 0; border-radius: 4px; background: transparent; text-align: left; cursor: pointer;
  touch-action: manipulation;
}
@media (hover: hover) { .row:hover { background: var(--hover); } }
.row:active { background: var(--hover); }
.meta { display: flex; align-items: center; gap: 6px; }
.time { margin-left: auto; font-size: 13px; line-height: 20px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.note { display: block; margin: 6px 0 0; overflow-wrap: anywhere; }
/* A past night with a half missing offers to add it */
.adds { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px; }
.add {
  min-height: 32px; padding: 0 10px; margin: 0;
  border: 0; border-radius: 4px; background: transparent; box-shadow: inset 0 0 0 1px var(--ring);
  font-size: 14px; line-height: 20px; color: var(--text-2); white-space: nowrap; cursor: pointer;
  touch-action: manipulation;
}
@media (hover: hover) { .add:hover { background: var(--hover); } }
.add:active { background: var(--hover); }

/* Composer */
.dock { position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); }
.dockin { padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
form { margin: 0; display: grid; gap: 8px; }
.bare { margin: 0; padding: 0; border: 0; min-width: 0; }
.rows { display: grid; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.when { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; gap: 2px; margin: 0; padding: 2px; border: 0; min-width: 0; border-radius: 6px; background: var(--seg); }
.segopt { position: relative; }
.segopt input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.segopt label {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 4px;
  font-size: 14px; font-weight: 500; color: var(--text-2); white-space: nowrap;
}
.segopt label svg { flex: none; }
.segopt input:checked + label { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--ring); }
.segopt input:disabled { cursor: default; }
.segopt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
.opt { position: relative; }
.opt input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt label {
  display: grid; place-items: center; height: 44px; border-radius: 4px;
  background: var(--bg); box-shadow: inset 0 0 0 1px var(--ring);
  font-size: 16px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums;
}
@media (hover: hover) { .opt input:not(:disabled):not(:checked):hover + label { background: var(--hover); } }
.opt input:disabled { cursor: default; }
.opt input:disabled + label { color: var(--text-3); }
.opt input:checked + label { background: var(--c-bg); color: var(--c-fg); box-shadow: inset 0 0 0 2px var(--c-ring); }
.opt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.o1 { --c-bg: var(--r1-bg); --c-fg: var(--r1-fg); --c-ring: var(--r1-ring); }
.o2 { --c-bg: var(--r2-bg); --c-fg: var(--r2-fg); --c-ring: var(--r2-ring); }
.o3 { --c-bg: var(--r3-bg); --c-fg: var(--r3-fg); --c-ring: var(--r3-ring); }
.o4 { --c-bg: var(--r4-bg); --c-fg: var(--r4-fg); --c-ring: var(--r4-ring); }
.o5 { --c-bg: var(--r5-bg); --c-fg: var(--r5-fg); --c-ring: var(--r5-ring); }

.line { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; }
#note, #eNote {
  width: 100%; min-width: 0; height: 44px; margin: 0; padding: 0 12px;
  font-size: 16px; color: var(--text); background: var(--fill);
  border: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--ring);
  text-overflow: ellipsis;
}
#note::placeholder, #eNote::placeholder { color: var(--text-2); opacity: 0.8; text-overflow: ellipsis; }
#note:disabled { color: var(--text-3); }
#note:focus-visible, #eNote:focus-visible { outline: none; background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px var(--accent-ring); }
.send {
  display: grid; place-items: center; width: 44px; height: 44px; margin: 0; padding: 0;
  border: 0; border-radius: 4px; background: var(--accent); color: #ffffff; cursor: pointer;
}
.send[aria-disabled="true"], .send:disabled { background: var(--hover); color: var(--text-3); cursor: default; }
.help { min-height: 18px; margin: 0; font-size: 13px; line-height: 18px; color: var(--text-2); }
.help.error { color: var(--danger); }

/* Changing or adding an entry: a sheet from the bottom */
.sheet {
  border: 0; padding: 0; margin: auto auto 0;
  width: 100%; max-width: 640px; max-height: 100%;
  border-radius: 12px 12px 0 0;
  background: var(--bg); color: var(--text);
  box-shadow: 0 -8px 24px rgba(15, 15, 15, 0.08);
}
.sheet::backdrop { background: rgba(15, 15, 15, 0.32); }
.edit {
  gap: 14px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.edit h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; outline: none; }
.seg.wide { display: grid; grid-template-columns: 1fr 1fr; }
.seg.wide .segopt label { justify-content: center; height: 36px; }
.fields { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 8px; }
.field { display: grid; gap: 4px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--text-2); }
.field select, .field input {
  width: 100%; min-width: 0; height: 44px; margin: 0; padding: 0 10px;
  border: 0; border-radius: 4px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--ring);
  font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums;
}
.field input.bad { box-shadow: inset 0 0 0 1px var(--danger), 0 0 0 1px var(--danger); }
.nudge { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.nudge button {
  height: 36px; padding: 0; margin: 0;
  border: 0; border-radius: 4px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--ring);
  font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; cursor: pointer;
  touch-action: manipulation;
}
.nudge button:active { background: var(--hover); }
.actions { display: flex; align-items: center; gap: 4px; padding-top: 2px; }
.actions .spacer { flex: 1; }
.btn.danger { color: var(--danger); margin-left: -10px; }
.btn.primary { min-height: 40px; padding: 0 18px; background: var(--accent); color: #ffffff; font-weight: 500; }
@media (hover: hover) { .btn.primary:hover { background: #1a73cc; } }
.btn.quietbtn { min-height: 40px; }

/* Short messages, with Undo after a change */
.toast {
  position: fixed; left: 50%; bottom: 16px; z-index: 20; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 608px;
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 6px 6px 14px;
  border-radius: 6px; background: var(--text); color: #ffffff; font-size: 14px; line-height: 20px;
  box-shadow: 0 4px 14px rgba(15, 15, 15, 0.2);
}
.toast .msg { flex: 1; min-width: 0; }
.toast button {
  min-height: 32px; padding: 0 10px; margin: 0; border: 0; border-radius: 4px; background: transparent;
  color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.toast button:focus-visible { outline-color: #ffffff; }

@media (max-width: 480px) {
  .head { padding-block: 28px 0; }
  h1 { font-size: 28px; }
}
@media (max-width: 360px) {
  .segopt label { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="col head">
    <div class="titlerow">
      <h1>Sleep Log</h1>
      <button type="button" id="copy" class="btn" disabled>Copy CSV</button>
    </div>
    <p class="sub"><span id="sub"></span> <span class="sync" id="sheet-sync" hidden></span></p>
    <ul class="legend" id="legend" aria-label="What the numbers mean after sleep">
      <li class="tag r1">1 · very poor</li><li class="tag r2">2 · poor</li><li class="tag r3">3 · fair</li><li class="tag r4">4 · good</li><li class="tag r5">5 · very good</li>
    </ul>
  </header>

  <div class="col" id="noticeWrap" hidden>
    <div class="stack">
      <div class="callout" role="status">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 8h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <p id="notice"></p>
      </div>
    </div>
  </div>
  <div class="col" id="csvWrap" hidden>
    <div class="stack">
      <div class="callout">
        <div class="csvbox">
          <p>Your browser wouldn’t copy automatically. Select all and copy:</p>
          <textarea id="csvText" readonly rows="6" spellcheck="false" aria-label="CSV text"></textarea>
          <button type="button" id="csvDone" class="btn solid">Done</button>
        </div>
      </div>
    </div>
  </div>

  <main class="col log" id="log" aria-label="Entries">
    <p class="quiet">Loading…</p>
  </main>

  <div class="dock" id="dock">
    <div class="col dockin">
      <form id="composer" autocomplete="off" novalidate>
        <fieldset class="bare" id="controls">
          <legend class="sr">New entry</legend>
          <div class="rows">
            <div class="top">
              <fieldset class="seg">
                <legend class="sr">Before or after sleep</legend>
                <span class="segopt"><input type="radio" name="slot" id="s-morning" value="morning"><label for="s-morning"><span id="ok-morning" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>After sleep</label></span>
                <span class="segopt"><input type="radio" name="slot" id="s-night" value="night"><label for="s-night"><span id="ok-night" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Before sleep</label></span>
              </fieldset>
              <span class="when" id="when"></span>
            </div>

            <fieldset class="scale">
              <legend class="sr">Rating from 1 to 5</legend>
              <div class="opt o1"><input type="radio" name="rating" id="r1" value="1" aria-label="1, very poor"><label for="r1" title="1 · very poor">1</label></div>
              <div class="opt o2"><input type="radio" name="rating" id="r2" value="2" aria-label="2, poor"><label for="r2" title="2 · poor">2</label></div>
              <div class="opt o3"><input type="radio" name="rating" id="r3" value="3" aria-label="3, fair"><label for="r3" title="3 · fair">3</label></div>
              <div class="opt o4"><input type="radio" name="rating" id="r4" value="4" aria-label="4, good"><label for="r4" title="4 · good">4</label></div>
              <div class="opt o5"><input type="radio" name="rating" id="r5" value="5" aria-label="5, very good"><label for="r5" title="5 · very good">5</label></div>
            </fieldset>

            <div class="line">
              <input id="note" type="text" maxlength="280" enterkeyhint="send" autocomplete="off" aria-label="A few words">
              <button type="submit" id="send" class="send" aria-label="Log it" aria-disabled="true">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </fieldset>
        <p class="help" id="help"></p>
      </form>

      <div class="callout" id="doneBox" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p id="doneText"></p>
      </div>
    </div>
  </div>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <form class="edit" id="editForm" autocomplete="off" novalidate>
    <h2 id="sheetTitle" tabindex="-1" autofocus>Edit entry</h2>
    <fieldset class="seg wide">
      <legend class="sr">Before or after sleep</legend>
      <span class="segopt"><input type="radio" name="eslot" id="e-night" value="night"><label for="e-night">Before sleep</label></span>
      <span class="segopt"><input type="radio" name="eslot" id="e-morning" value="morning"><label for="e-morning">After sleep</label></span>
    </fieldset>
    <div class="fields">
      <label class="field" for="eNight"><span>Night</span><select id="eNight"></select></label>
      <label class="field" for="eTime"><span>Time, 24h</span><input id="eTime" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="8" placeholder="22:30" aria-describedby="eHelp"></label>
    </div>
    <div class="nudge" role="group" aria-label="Shift the time">
      <button type="button" data-min="-60">−1h</button>
      <button type="button" data-min="-30">−30m</button>
      <button type="button" data-min="-15">−15m</button>
      <button type="button" data-min="15">+15m</button>
      <button type="button" data-min="30">+30m</button>
      <button type="button" data-min="60">+1h</button>
    </div>
    <fieldset class="scale">
      <legend class="sr">Rating from 1 to 5</legend>
      <div class="opt o1"><input type="radio" name="erating" id="e-r1" value="1"><label for="e-r1">1</label></div>
      <div class="opt o2"><input type="radio" name="erating" id="e-r2" value="2"><label for="e-r2">2</label></div>
      <div class="opt o3"><input type="radio" name="erating" id="e-r3" value="3"><label for="e-r3">3</label></div>
      <div class="opt o4"><input type="radio" name="erating" id="e-r4" value="4"><label for="e-r4">4</label></div>
      <div class="opt o5"><input type="radio" name="erating" id="e-r5" value="5"><label for="e-r5">5</label></div>
    </fieldset>
    <input id="eNote" type="text" maxlength="280" enterkeyhint="done" autocomplete="off" aria-label="A few words">
    <p class="help" id="eHelp"></p>
    <div class="actions">
      <button type="button" class="btn danger quietbtn" id="eDelete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn quietbtn" id="eCancel">Cancel</button>
      <button type="submit" class="btn primary" id="eSave">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="msg" id="toastMsg"></span>
  <button type="button" id="toastUndo">Undo</button>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const SLOTS = ['morning', 'night'];
  // The stored slot names stay 'morning' and 'night' so entries already saved keep working.
  // Morning is the After sleep entry, night is the Before sleep entry.
  const SLOT_LABEL = { morning: 'After sleep', night: 'Before sleep' };

  const sheet = $('#sheet'), editForm = $('#editForm'), sheetTitle = $('#sheetTitle'),

  // Reads a typed time: 2230, 22:30, 7:40, 740, 7.40, 7, and a trailing am/pm. Gives { h, m } or null.
  function parseTime(text) {

      if (s.length <= 2) { hr = +s; mi = 0; } else { hr = +s.slice(0, -2); mi = +s.slice(-2); }
    }
    if (ap) {
      if (hr < 1 || hr > 12) return null;
      if (ap === 'p' && hr < 12) hr += 12;
      if (ap === 'a' && hr === 12) hr = 0;
    }
    if (hr > 23 || mi > 59) return null;
    return { h: hr, m: mi };
  }
  const hhmm = (t) => pad(t.h) + ':' + pad(t.m);

  // The moment a time on a night stands for. Before sleep is that evening, or after midnight
  // (before 04:00) the next day; After sleep is the morning after.
  function momentFor(night, slot, t) {
    const p = night.split('-').map(Number);
    const next = slot === 'morning' || t.h < ROLLOVER;
    return new Date(p[0], p[1] - 1, p[2] + (next ? 1 : 0), t.h, t.m);
  }

  // Tonight and the 30 nights before it, plus whichever night the entry is on.
  function fillNights(selected) {
    const today = dayOf(new Date());
    const set = new Set([selected]);
    for (let i = 0; i <= 30; i++) set.add(addDays(today, -i));
    eNightSel.replaceChildren(...[...set].sort().reverse().map((n) => {
      const lab = nightLabel(n, today);
      return h('option', { value: n }, lab[1] ? lab[0] + ' · ' + lab[1] : shortDay(n));
    }));
    eNightSel.value = selected;
  }
  const eSlot = () => { const r = editForm.querySelector('input[name="eslot"]:checked'); return r ? r.value : 'night'; };
  const eRating = () => { const r = editForm.querySelector('input[name="erating"]:checked'); return r ? +r.value : 0; };
  const flagInput = (input, bad) => {
    input.classList.toggle('bad', bad);
    if (bad) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
  };

  // The line under the note: when the entry falls and what its number means, or what went wrong.
  function paintSheet(error) {
    const slot = eSlot(), words = WORDS[slot];
    editForm.querySelectorAll('input[name="erating"]').forEach((inp, i) => {
      inp.setAttribute('aria-label', (i + 1) + ', ' + words[i + 1]);
      inp.nextElementSibling.title = (i + 1) + ' · ' + words[i + 1];
    });
    eNote.placeholder = PROMPT[slot];
    eTime.placeholder = slot === 'night' ? '22:30' : '07:00';
    let text = error || '';
    if (!text) {
      const t = parseTime(eTime.value), r = eRating(), parts = [];
      if (t && eNightSel.value) {
        const d = momentFor(eNightSel.value, slot, t);
        parts.push(shortDay(keyOf(d)) + ' at ' + hhmm(t));
      }
      parts.push(r ? r + ' · ' + words[r] : '1 = ' + words[1] + ', 5 = ' + words[5]);
      text = parts.join(' · ');
    }
    eHelp.textContent = text;
    eHelp.className = 'help' + (error ? ' error' : '');
    if (error) say(error);
  }

  function openSheet(state) {
    const e = state.entry;
    editing = state;
    const night = e ? nightOf(e) : state.night, slot = e ? e.slot : state.slot;
    sheetTitle.textContent = e ? 'Edit entry' : 'Add ' + SLOT_LABEL[slot].toLowerCase();
    $('#e-' + slot).checked = true;
    fillNights(night);
    eTime.value = e ? e.at.slice(11, 16) : '';
    flagInput(eTime, false);
    editForm.querySelectorAll('input[name="erating"]').forEach((x) => { x.checked = !!e && +x.value === e.rating; });
    eNote.value = e ? e.note : '';
    eDelete.hidden = !e;
    paintSheet();
    if (!sheet.open) sheet.showModal();
  }
  function closeSheet() { if (sheet.open) sheet.close(); }

  logEl.addEventListener('click', (ev) => {
    if (ev.target.closest('#more')) {
      shownNights += PAGE_NIGHTS;
      renderLog();
      const m = $('#more');
      if (m) m.focus({ preventScroll: true });
      return;
    }
    const row = ev.target.closest('.row');
    if (row) {
      syncLocal();
      const e = entries.find((x) => idOfEntry(x) === row.dataset.id);
      if (e) openSheet({ id: row.dataset.id, entry: e }); else render();
      return;
    }
    const add = ev.target.closest('.add');
    if (add) openSheet({ id: null, night: add.dataset.night, slot: add.dataset.slot });
  });

  sheet.addEventListener('click', (ev) => { if (ev.target === sheet) closeSheet(); });   // a tap outside the sheet
  sheet.addEventListener('close', () => { editing = null; if (needsReload) location.reload(); });
  $('#eCancel').addEventListener('click', closeSheet);
  editForm.addEventListener('change', () => paintSheet());

  // Tapping the time selects it all, so typing replaces it. (Phones place the cursor after the tap, so select again on finger-up.)
  let typed = false;
  const selectTime = () => { if (!typed) { try { eTime.select(); } catch (e) {} } };
  eTime.addEventListener('focus', () => { typed = false; setTimeout(selectTime, 0); });
  eTime.addEventListener('pointerup', () => setTimeout(selectTime, 0));
  eTime.addEventListener('input', () => { typed = true; flagInput(eTime, false); paintSheet(); });
  eTime.addEventListener('blur', () => {
    const t = parseTime(eTime.value);
    if (t) eTime.value = hhmm(t);
    paintSheet();
  });
  eNote.addEventListener('input', () => { if (eHelp.classList.contains('error')) paintSheet(); });

  // Shifting the time keeps the night; going past midnight moves Before sleep into the small hours.
  for (const b of editForm.querySelectorAll('.nudge button')) {
    b.addEventListener('click', () => {
      const t = parseTime(eTime.value) || parseTime(eTime.placeholder);
      let m = (t.h * 60 + t.m + Number(b.dataset.min)) % 1440;
      if (m < 0) m += 1440;
      eTime.value = hhmm({ h: Math.floor(m / 60), m: m % 60 });
      flagInput(eTime, false);
      paintSheet();
    });
  }

  editForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const st = editing;
    if (!st) { closeSheet(); return; }
    const slot = eSlot(), night = eNightSel.value, t = parseTime(eTime.value), r = eRating();
    flagInput(eTime, !t);
    if (!t) {
      paintSheet(eTime.value.trim() ? 'Couldn’t read that time. Try 2230 or 22:30.' : 'Add roughly when, like 2230 or 0710.');
      eTime.focus();
      return;
    }
    if (!r) { paintSheet('Pick a number from 1 to 5.'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(night)) return;
    const old = st.entry;
    const same = !!old && nightOf(old) === night && old.slot === slot && old.at.slice(11, 16) === hhmm(t);
    const when = momentFor(night, slot, t);
    if (!same && when.getTime() > Date.now() + 2 * 60 * MIN) {
      paintSheet('That’s still to come. Check the night.');
      return;
    }
    const e = { date: dateFor(night, slot), slot, rating: r, note: cleanNote(eNote.value), at: same ? old.at : stamp(when) };
    if (old && e.date === old.date && e.slot === old.slot && e.rating === old.rating && e.note === old.note && e.at === old.at) {
      closeSheet();
      return;
    }
    const why = replace(st.id, e);
    if (why === 'taken') {
      const lab = nightLabel(night, dayOf(new Date()));
      paintSheet((lab[1] ? lab[0] : 'The ' + lab[0].charAt(0).toLowerCase() + lab[0].slice(1)) + ' already has ' +
        (slot === 'night' ? 'a before sleep' : 'an after sleep') + ' entry. Change that one instead.');
      return;
    }
    if (why) { paintSheet(WHY[why] || WHY.storage); return; }
    closeSheet();
    render();
    const now = idOfEntry(e);
    toast(old ? 'Entry updated' : SLOT_LABEL[slot] + ' added', old ? () => replace(now, old) : () => remove(now));
  });

  eDelete.addEventListener('click', () => {
    const st = editing;
    if (!st || !st.entry) return;
    const why = remove(st.id);
    if (why) { paintSheet(WHY[why] || WHY.storage); return; }
    closeSheet();
    render();
    toast('Entry deleted', () => replace(null, st.entry));
  });

  // ---------- sending the log to the Tracking log sheet ----------
  // Off until the setup link (…/#log=<web app address>&key=<key>) has been opened in any tracker on this site.
  // Every change sends the whole log, so edits and deletes reach the sheet too. A send that
  // fails (no signal) is repeated when the app is next opened or comes back online.
  const LINK = 'tracking-log.link.v1';   // one setting for every tracker on this site
  const UNSENT = KEY + '.unsent';
  const SENT_ONCE = KEY + '.sent-once';  // until the first send, the whole existing log still needs to go
  const SOURCE = 'sleep_app';
  const okUrl = (u) => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) ||
    /^http:\/\/(localhost|127\.0\.0\.1):\d+\/[\w/-]*$/.test(u);

  function link() {
    try {
      const v = JSON.parse(localStorage.getItem(LINK) || 'null');
      if (v && typeof v.url === 'string' && okUrl(v.url) && typeof v.key === 'string' && v.key) return v;
    } catch (_) {}
    return null;
  }
  const unsent = () => { try { return localStorage.getItem(UNSENT) === '1'; } catch (_) { return false; } };
  const setUnsent = (on) => { try { if (on) localStorage.setItem(UNSENT, '1'); else localStorage.removeItem(UNSENT); } catch (_) {} };

  const SHEET_LABELS = { sent: 'synced', sending: 'syncing…', waiting: 'not synced yet', paused: 'sync paused', error: 'sync error' };
  let sheetState = '';
  function setSheet(state, note) {
    const was = sheetState;
    sheetState = state;
    const on = !!link() && !!SHEET_LABELS[state];
    syncEl.hidden = !on;
    syncEl.textContent = on ? SHEET_LABELS[state] : '';
    syncEl.title = note || '';
    syncEl.classList.toggle('warn', state === 'paused' || state === 'error');
    if ((state === 'paused' || state === 'error') && state !== was) toast('Sheet: ' + (note || SHEET_LABELS[state]), null, 6000);
  }

  function callSheet(cfg, body) {
    // A plain-text body keeps this a simple request, which Google's web apps accept from another site.
    return fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: cfg.key }, body)) })
      .then((res) => res.json());
  }

  let sending = false, sendAgain = false, sendTimer = 0;
  function queueSend(ms) { clearTimeout(sendTimer); sendTimer = setTimeout(sendLog, ms); }

  function changed() {
    setUnsent(true);
    // A send already on its way was built before this change, so make sure another one follows it.
    // Without this, an answer arriving within 1.2s of the change marked it as sent when it wasn't.
    if (link()) { if (sending) sendAgain = true; setSheet('waiting'); queueSend(1200); }
  }

  // One row per entry in the sheet's format: id, time, what, value, note.
  // The id is the night and the half, so the two entries of a night sit side by side.
  function sheetRows() {
    return entries.map((e) => ({
      id: nightOf(e) + '_' + SLOT_CSV[e.slot], time: e.at, what: SLOT_SHEET[e.slot], value: e.rating, note: e.note
    }));
  }

  async function sendLog() {
    const cfg = link();
    if (!cfg) { setSheet(''); return; }
    if (sending) { sendAgain = true; return; }
    if (!unsent()) { setSheet('sent'); return; }
    sending = true;
    sendAgain = false;
    setSheet('sending');
    syncLocal();
    let res = null;
    try { res = await callSheet(cfg, { source: SOURCE, rows: sheetRows() }); } catch (_) {}
    sending = false;
    if (res && res.ok) {
      if (!sendAgain) setUnsent(false);
      try { localStorage.setItem(SENT_ONCE, '1'); } catch (_) {}
      setSheet('sent');
    } else if (res && res.code === 'shrink') {
      setSheet('paused', res.error);
    } else if (res) {
      setSheet('error', res.error || 'it said no');
    } else {
      setSheet('waiting');
    }
    if (sendAgain) queueSend(300);
  }
  const sendIfNeeded = () => { if (link() && unsent()) queueSend(0); };

  // The setup link: saves where to send, checks the sheet answers, then sends what's already here.
  function setupFromLink() {
    const hp = new URLSearchParams(location.hash.slice(1));
    const url = hp.get('log'), key = hp.get('key');
    if (!url && !key) return false;
    history.replaceState(null, '', location.pathname + location.search);
    if (!url || !key || !okUrl(url)) { toast('That setup link doesn’t look right', null, 5000); return true; }
    try { localStorage.setItem(LINK, JSON.stringify({ url, key })); }
    catch (_) { toast('Couldn’t save the sync setting in this browser', null, 5000); return true; }
    setUnsent(true);
    setSheet('sending');
    callSheet({ url, key }, { ping: true }).then((res) => {
      if (res && res.ok) {
        toast('Sync is on: entries now go to the sheet', null, 4000);
        sendIfNeeded();
      } else {
        setSheet('error', (res && res.error) || 'no answer');
      }
    }).catch(() => {
      // Online but no readable answer usually means the web app isn't shared with Anyone.
      if (navigator.onLine) setSheet('error', 'couldn’t reach the sheet: check the web app’s access is set to Anyone');
      else setSheet('waiting');
    });
    return true;
  }
  function startSheet() {
    if (setupFromLink() || !link()) return;
    try { if (localStorage.getItem(SENT_ONCE) !== '1') setUnsent(true); } catch (_) {}
    if (unsent()) queueSend(0); else setSheet('sent');
  }

  /* ---------- start ---------- */

  function registerWorker() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    // When a newer version takes over, reload once so it shows up without any effort (after the sheet closes, if it's open).
    const hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadWorker) return;
      if (sheet.open) needsReload = true; else location.reload();
    });
    const go = () => { navigator.serviceWorker.register('sw.js').catch(() => {}); };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
  }

  // A fresh start, once per browser: the first time the Sleep Log opened, the log saved in this browser was cleared.
  // The marker is written first, so if the browser won't take it nothing is deleted, and it never runs twice.
  // Only this app's own keys are touched; other apps on the same site keep theirs.
  function freshStart() {
    try {
      if (localStorage.getItem(RESET_KEY) === RESET_TO) return;
      localStorage.setItem(RESET_KEY, RESET_TO);
      if (localStorage.getItem(RESET_KEY) !== RESET_TO) return;
      [KEY, KEY + '.unreadable', DRAFT_KEY].forEach((k) => localStorage.removeItem(k));
    } catch (e) {}
  }

  function boot() {
    freshStart();
    shownDay = dayOf(new Date());
    loadDraft();
    try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); } catch (e) { canSave = false; }
    const r = readLocal();
    entries = r.list;
    if (!r.ok) canSave = false;
    if (!canSave) setNotice(NO_LOCAL);
    // Ask the browser not to clear this data when the phone is short on space.
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    render();
    scrollToEnd(true);
    schedule();
    window.addEventListener('storage', (ev) => {
      if (ev.key === KEY || ev.key === null) { syncLocal(); render(); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncLocal(); rollDay(); render(); sendIfNeeded(); } });
    window.addEventListener('online', sendIfNeeded);
    window.addEventListener('hashchange', setupFromLink);   // the setup link tapped while the app is already open
    registerWorker();
    startSheet();
  }

  boot();
})();
</script>
</body>
</html>
