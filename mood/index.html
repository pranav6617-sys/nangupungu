<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="A fast check-in with how you feel, right now.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mood">
  <title>Mood · check in</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true"><defs>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs></svg>

  <div class="app-shell">
    <header class="app-header">
      <div class="topbar">
        <div class="brand" aria-label="Mood"><span class="brand-mark" aria-hidden="true"></span><span>Mood</span></div>
        <button class="sync-status" id="sheet-sync" type="button" title="Google Sheet connection">
          <span class="status-dot" aria-hidden="true"></span><span id="sync-label">On device</span>
        </button>
      </div>
      <div class="step-row">
        <ol class="progress" aria-label="Check-in progress">
          <li aria-current="step"><span class="sr-only">Step 1, ratings</span></li>
          <li><span class="sr-only">Step 2, feelings</span></li>
          <li><span class="sr-only">Step 3, note</span></li>
        </ol>
        <span class="step-label" id="step-label">1 of 3</span>
      </div>
    </header>

    <p id="notice" class="notice" role="alert" hidden></p>

    <main id="main">
      <section class="page page-ratings" id="page-1" aria-labelledby="heading-1">
        <header class="page-heading">
          <p class="eyebrow">RIGHT NOW</p>
          <h1 id="heading-1" tabindex="-1">How are you feeling?</h1>
          <p>One tap on each line.</p>
        </header>

        <div class="ratings" id="ratings"></div>

        <div class="page-footer single-footer">
          <span id="rating-count" class="footer-status" aria-live="polite">0 of 5</span>
          <button class="primary" id="next-1" type="button" disabled>
            <span>Next</span><svg aria-hidden="true"><use href="#arrow"/></svg>
          </button>
        </div>
      </section>

      <section class="page page-feelings" id="page-2" aria-labelledby="heading-2" hidden>
        <header class="page-heading compact-heading">
          <div class="heading-line"><p class="eyebrow">FEELINGS</p><span class="optional">OPTIONAL</span></div>
          <h1 id="heading-2" tabindex="-1">What feels closest?</h1>
        </header>

        <div class="quadrant-tabs" aria-label="Feeling areas">
          <button class="quadrant-tab q-coral" type="button" data-quadrant="high-unpleasant" aria-pressed="false"><span>High energy</span><strong>Unpleasant</strong></button>
          <button class="quadrant-tab q-peach" type="button" data-quadrant="high-pleasant" aria-pressed="false"><span>High energy</span><strong>Pleasant</strong></button>
          <button class="quadrant-tab q-lilac" type="button" data-quadrant="low-unpleasant" aria-pressed="false"><span>Low energy</span><strong>Unpleasant</strong></button>
          <button class="quadrant-tab q-mint" type="button" data-quadrant="low-pleasant" aria-pressed="false"><span>Low energy</span><strong>Pleasant</strong></button>
        </div>

        <div class="word-panel" id="word-panel">
          <div class="panel-meta">
            <span id="quadrant-title">Higher energy · unpleasant</span>
            <span id="selection-count" aria-live="polite">None selected</span>
          </div>
          <div id="feeling-panels" class="feeling-panels"></div>
        </div>

        <div class="page-footer split-footer">
          <button class="back" data-back="1" type="button"><span aria-hidden="true">←</span><span>Back</span></button>
          <button class="primary" id="next-2" type="button"><span>Next</span><svg aria-hidden="true"><use href="#arrow"/></svg></button>
        </div>
      </section>

      <section class="page page-note" id="page-3" aria-labelledby="heading-3" hidden>
        <header class="page-heading">
          <div class="heading-line"><p class="eyebrow">CONTEXT</p><span class="optional">OPTIONAL</span></div>
          <h1 id="heading-3" tabindex="-1">Add a sentence?</h1>
          <p>Only if it helps explain this moment.</p>
        </header>

        <form id="context-form">
          <label class="note-field" for="context">
            <span>What’s happening?</span>
            <textarea id="context" name="context" rows="4" maxlength="500" placeholder="Walking home after a difficult call…"></textarea>
          </label>

          <div class="page-footer split-footer">
            <button class="back" data-back="2" type="button"><span aria-hidden="true">←</span><span>Back</span></button>
            <button class="primary" id="submit" type="submit"><span>Save check-in</span><svg aria-hidden="true"><use href="#check"/></svg></button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
  <noscript><p class="notice noscript">Turn on JavaScript to use this check-in.</p></noscript>
</body>
</html>
