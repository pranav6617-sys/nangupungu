<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#101116">
  <title>Mood check-in · screen two</title>
  <style>
    /* The font is cut down to the few letters the screens use, so it is a few kilobytes. */
    @font-face{font-family:"Geist Mono";src:url(geist-mono-ui.woff2) format("woff2");font-weight:100 900;font-display:block}
    :root{
      --bg:#101116;          /* graphite */
      --label:#B0B1B3;       /* silver-grey */
      --dim:#505157;         /* the forward arrow before a choice */
      --lavender:#ABA4DF;    /* the forward arrow after a choice */
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-l:env(safe-area-inset-left,0px);
      --safe-r:env(safe-area-inset-right,0px);
      color-scheme:dark;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
    body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:1.5px solid var(--label);outline-offset:4px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* The whole screen is the field. app-h follows the visible part of the screen. */
    .heart{position:fixed;left:0;top:var(--app-top,0px);width:100%;height:var(--app-h,100dvh);overflow:hidden;background:var(--bg);touch-action:none}
    .field{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hit{position:absolute;inset:0;touch-action:none;cursor:crosshair}


    .back{position:absolute;z-index:3;top:calc(var(--safe-t) + 2px);left:calc(var(--safe-l) + 6px);width:52px;height:46px;display:grid;place-items:center;color:var(--label)}
    .back svg{width:22px;height:14px}
    .next{position:absolute;z-index:3;right:calc(var(--safe-r) + 12px);bottom:calc(var(--safe-b) + 14px);width:61px;height:61px;display:grid;place-items:center;color:var(--dim);transition:color .3s ease,transform .15s ease}
    .next svg{width:52px;height:52px;overflow:visible}
    .next.on{color:var(--lavender)}
    .next.on:active{transform:scale(.95)}
    .next.pressed{transform:scale(.93)}
    @media (prefers-reduced-motion:reduce){.next{transition:none!important}}
    .heart.off{visibility:hidden;pointer-events:none}
  
    /* screen two: the title and the three lanes */
    .heart.off{visibility:hidden;pointer-events:none}
    .title{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 92px);margin:0;padding:0 26px;text-align:center;font-family:"Geist Mono",ui-monospace,"Roboto Mono",monospace;font-size:21px;line-height:1.4;font-weight:400;letter-spacing:-.015em;color:#E9E9EE;min-height:4.2em;pointer-events:none;text-wrap:balance}
    .title span{display:inline;transition:opacity .22s ease}
    @media (prefers-reduced-motion:reduce){.title span{transition:none}}
  </style>
</head>
<body>
  <main class="heart pad" id="pad">
    <canvas class="field" id="pfield" aria-hidden="true"></canvas>
    <div class="hit" id="phit" aria-hidden="true"></div>

    <p class="title" id="ptitle" aria-live="polite"></p>

    <button class="back" id="pback" type="button" aria-label="Back">
      <svg viewBox="0 0 22 14" aria-hidden="true"><path d="M21 7H1.6M7.4 1.2 1.6 7l5.8 5.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="next" id="pnext" type="button" aria-label="Continue" aria-disabled="true">
      <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M15.5 26h20.5M29.5 19.4 36 26l-6.5 6.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <!-- For screen readers: the same three questions as plain choices. -->
    <div class="sr-only" id="pradios"></div>
  </main>

  <script>
  (() => {
    'use strict';

    // Starting values. Tune these on the phone.
    const CFG = {
      // the grid: the same field of small dots as screen one
      columns: 64, minPitch: 5.2, maxPitch: 7.2, dot: 1.15, dotVary: 0.22, litSize: 0.6,
      colour: [112, 114, 140], pale: [226, 224, 244], bg: [16, 17, 22],
      gold: [245, 196, 104], red: [244, 92, 84], blue: [122, 146, 255], mint: [108, 230, 174], blendSharp: 2,
      // the blobs: small clouds of lit dots
      radius: 0.12,         // blob size, as a share of the screen width
      falloff: 1.8,         // how quickly a blob thins towards its edge (bigger = tighter)
      amp: 1.7,             // strength of the blob you are about to place
      quiet: 0.95,          // strength of blobs still waiting their turn
      placedAmp: 1.15,      // strength of a blob once placed (the heartbeat lifts it from here)
      edge: 0.1, twinkle: 0.1, rungGlow: 0.55, rungSize: 0.35,
      fuzz: 0.28, fuzzIn: 0.14, fuzzOut: 0.7, maxShift: 2,   // how loosely the dots sit inside a blob, in gaps
      drift: 0.4, driftSpeed: 0.8, driftIn: 0.35, driftOut: 0.9, // the slow wander of dots inside a blob
      lowBpm: 28, highBpm: 60,   // heartbeat of a placed blob: slow at level 1, fast at level 5, like screen one
      dub: 0.3, lubRise: 0.12, dubRise: 0.10, gapSlow: 0.46, gapFast: 0.34, pulse: 0.9, // the double beat, and how much it lifts the glow
      tintShift: 0.75, tintFloor: 0.075,  // the three blobs are three shades of the colour you picked
      // how the blobs move
      spring: 9.5, damping: 0.5,   // how quickly a blob goes to its level, and how much it overshoots
      hold: 16,                    // how closely a blob follows your finger
      swim: 0.17,                  // how fast a free blob swims, as a share of the screen width per second
      swimTurn: 0.8,               // how much its heading wanders, in radians per second
      swimEase: 2.4,               // how quickly it settles into that drift
      follow: 1.2,                 // how much its heading follows where it is actually going (carries it round another blob)
      pushForce: 260, pushReach: 1.9,   // blobs push each other apart when they get close (force, reach in blob radii)
      swirlForce: 150, swirlReach: 4.5, // and swirl round each other (force, reach in blob radii)
      pullForce: 70, pullReach: 7,      // and are drawn back together from further away
      bump: 3.5,                        // how much a passing blob nudges a placed one
      flingMin: 400, flingHard: 1500, flingKick: 0.55, // px/s: a flick, a hard fling, and how much speed the blob keeps
      stretchGain: 0.0009, stretchMax: 0.8, stretchSpring: 16, stretchDamp: 0.25, // the jelly
      trailMin: 200, trailMax: 1000, trailFade: 0.3, trailAmp: 0.5,
      calmFps: 30, activeFps: 60,
      seed: 0
    };
    Object.assign(CFG, window.HEART_CFG || {});
    const testClock = typeof window.HEART_CLOCK === 'function';
    const clock = () => (testClock ? window.HEART_CLOCK() : performance.now()) / 1000;

    // The three questions, from 1 (bottom) to 5 (top). Edit the words here.
    // Each phrase says whether it is good news (good) or bad news, which decides where a sentence says "but".
    /*lanes:start*/
    const ph = (t, good) => ({ t, good });
    const LANES = [
      { key: 'tension', name: 'Tension', words: [ph('very relaxed', 1), ph('relaxed', 1), ph('steady', 1), ph('a little tense', 0), ph('on edge', 0)] },
      { key: 'focus',   name: 'Focus',   words: [ph("can't focus", 0), ph('distracted', 0), ph('focus is normal', 1), ph('focused', 1), ph('very focused', 1)] },
      { key: 'speed',   name: 'Thinking', words: [ph('thinking is sluggish', 0), ph('thinking is slow', 0), ph('thinking is normal', 1), ph('thinking is fast', 1), ph('thoughts are racing', 0)] }
    ];
    /*lanes:end*/

    const TAU = Math.PI * 2;
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const lerp = (a, b, k) => a + (b - a) * k;
    const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
    // A small seeded random source, so a test can replay exactly the same heart.
    let seedState = (CFG.seed || Math.floor(Math.random() * 4294967296)) >>> 0;
    const rand = () => { seedState = (seedState + 0x6D2B79F5) >>> 0; let t = seedState; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const hashAt = (i, j, s) => { let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(s, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
    const vnoise = (x, y, s) => { // smooth noise from -1 to 1
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const a = hashAt(xi, yi, s), b = hashAt(xi + 1, yi, s), c = hashAt(xi, yi + 1, s), d = hashAt(xi + 1, yi + 1, s);
      return (lerp(lerp(a, b, u), lerp(c, d, u), v)) * 2 - 1;
    };

    // Colours are blended in OKLab, where a halfway colour looks halfway, so red to green never turns muddy.
    const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const gam = c => { c = clamp(c, 0, 1); return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; };
    const toLab = ([r, g, b]) => {
      const R = lin(r), G = lin(g), B = lin(b);
      const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B), m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B), s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
      return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
    };
    const fromLab = ([L, a, b]) => {
      const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3), m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3), s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
      return [gam(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s), gam(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s), gam(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)];
    };
    const LAB = { pale: toLab(CFG.pale), hp: toLab(CFG.gold), hu: toLab(CFG.red), lu: toLab(CFG.blue), lp: toLab(CFG.mint) };


    const pad = document.getElementById('pad'), canvas = document.getElementById('pfield'), hit = document.getElementById('phit');
    const next = document.getElementById('pnext'), back = document.getElementById('pback'), titleEl = document.getElementById('ptitle'), radioBox = document.getElementById('pradios');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');

    // ---------- the dot grid ----------
    let W = 0, Hgt = 0, dpr = 1, N = 0, P = 6, restD = 1, R = 40;
    let bx, by, vig, th, nz, gx, gy, szv, tf, tp, fz, em, ecol, mv, dr, rung, out;
    const yLevel = [0, 0, 0, 0, 0, 0], laneX = [0, 0, 0];
    let wallTop = 0, wallBot = 0;
    let dirty = true, paused = false;

    function build() {
      const box = pad.getBoundingClientRect();
      W = box.width; Hgt = box.height;
      dpr = Math.min(3, window.devicePixelRatio || 1);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(Hgt * dpr);
      P = clamp(W / CFG.columns, CFG.minPitch, CFG.maxPitch);
      restD = CFG.dot; R = CFG.radius * W;
      const cols = Math.ceil(W / P) + 1, rows = Math.ceil(Hgt / P) + 1;
      const x0 = (W - (cols - 1) * P) / 2, y0 = (Hgt - (rows - 1) * P) / 2;
      N = cols * rows;
      bx = new Float32Array(N); by = new Float32Array(N); vig = new Float32Array(N); th = new Float32Array(N); nz = new Float32Array(N);
      gx = new Float32Array(N); gy = new Float32Array(N); szv = new Float32Array(N); tf = new Float32Array(N); tp = new Float32Array(N);
      fz = new Float32Array(N); em = new Float32Array(N); mv = new Float32Array(N); dr = new Float32Array(N * 8); rung = new Float32Array(N);
      ecol = new Float32Array(N * 3); out = new Float32Array(N * 8);
      const snap = v => (Math.round(v * dpr - 0.5) + 0.5) / dpr;
      let i = 0;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) {
        const x = snap(x0 + c * P), y = snap(y0 + r * P), u = x / W, v = y / Hgt;
        bx[i] = x; by[i] = y;
        vig[i] = smooth(-0.01, 0.12, v) * smooth(1.01, 0.88, v) * smooth(-0.015, 0.06, u) * smooth(1.015, 0.94, u);
        th[i] = hashAt(c, r, 5);
        nz[i] = vnoise(c / 6, r / 6, 17);
        const u1 = Math.max(1e-6, hashAt(c, r, 3)), u2 = hashAt(c, r, 4), m = Math.sqrt(-2 * Math.log(u1));
        gx[i] = clamp(m * Math.cos(TAU * u2), -2.4, 2.4); gy[i] = clamp(m * Math.sin(TAU * u2), -2.4, 2.4);
        szv[i] = 1 + CFG.dotVary * (hashAt(c, r, 6) * 2 - 1);
        tf[i] = (0.08 + 0.22 * hashAt(c, r, 8)) * TAU; tp[i] = hashAt(c, r, 9) * TAU;
        for (let k = 0; k < 2; k++) {
          dr[8 * i + 4 * k] = (k ? 1.7 : 0.8) + (k ? 1.2 : 0.7) * hashAt(c, r, 20 + k * 4);
          dr[8 * i + 4 * k + 1] = hashAt(c, r, 21 + k * 4) * TAU;
          dr[8 * i + 4 * k + 2] = (k ? 1.7 : 0.8) + (k ? 1.2 : 0.7) * hashAt(c, r, 22 + k * 4);
          dr[8 * i + 4 * k + 3] = hashAt(c, r, 23 + k * 4) * TAU;
        }
      }
      // Three lanes, five levels. Level 5 is the top rung, level 1 the bottom one.
      for (let j = 0; j < 3; j++) laneX[j] = W * (2 * j + 1) / 6;
      const top = Math.max(0.30 * Hgt, 92 + 4.2 * 21 + 62), bot = Hgt - Math.max(0.2 * Hgt, 150);
      const step = Math.round((bot - top) / 4 / P) * P;
      R = Math.min(CFG.radius * W, 0.5 * step); // on a short screen the blobs get smaller so neighbouring rungs stay apart
      for (let l = 1; l <= 5; l++) yLevel[l] = bot - (l - 1) * step;
      wallTop = yLevel[5] - 0.55 * R; wallBot = yLevel[1] + 0.55 * R;
      // The rungs are rows of the same dot grid, a little brighter, one short segment per lane.
      const laneW = W / 3;
      for (let l = 1; l <= 5; l++) {
        let row = 0, best = 1e9;
        for (let k = 0; k < N; k++) { const d = Math.abs(by[k] - yLevel[l]); if (d < best) { best = d; row = by[k]; } }
        yLevel[l] = row;
        for (let k = 0; k < N; k++) {
          if (Math.abs(by[k] - row) > 0.01) continue;
          for (let j = 0; j < 3; j++) {
            const t = Math.abs(bx[k] - laneX[j]) / (laneW * 0.4);
            if (t < 1) rung[k] = Math.max(rung[k], (1 - smooth(0.7, 1, t)) * (l === 3 ? 1 : 0.8));
          }
        }
      }
      renderer.resize();
      dirty = true;
    }

    // ---------- colours: three shades of the colour chosen on screen one ----------
    const base = { pu: 0.8, e: 0.8 };
    const tint = [[0.96, 0.77, 0.41], [0.96, 0.77, 0.41], [0.96, 0.77, 0.41]];
    function setColour(pleasant, energy) {
      base.pu = clamp(pleasant, 0, 1); base.e = clamp(energy, 0, 1);
      const pu = base.pu, e = base.e, sh = CFG.blendSharp;
      const w = [Math.pow((1 - pu) * e, sh), Math.pow(pu * e, sh), Math.pow((1 - pu) * (1 - e), sh), Math.pow(pu * (1 - e), sh)];
      const tot = w[0] + w[1] + w[2] + w[3] || 1;
      const q = [0, 1, 2].map(j => (w[0] * LAB.hu[j] + w[1] * LAB.hp[j] + w[2] * LAB.lu[j] + w[3] * LAB.lp[j]) / tot);
      const rad = Math.hypot(pu - 0.5, e - 0.5) * 2 / Math.SQRT2;
      const sat = 0.25 + 0.75 * smooth(0.05, 0.5, rad);
      const lab = [0, 1, 2].map(j => lerp(LAB.pale[j], q[j], sat));
      const C = Math.hypot(lab[1], lab[2]), h = Math.atan2(lab[2], lab[1]), C2 = Math.max(C, CFG.tintFloor);
      const shade = dh => fromLab([lab[0], C2 * Math.cos(h + dh), C2 * Math.sin(h + dh)]);
      tint[0] = fromLab(lab); tint[1] = shade(-CFG.tintShift); tint[2] = shade(CFG.tintShift);
    }

    // ---------- the blobs ----------
    const hs = { last: null, dt: 0, dc: 0 };
    let blobs = [], dragging = null, samples = [], lastTouch = -99, moving = 0;
    function reset() {
      blobs = LANES.map((l, j) => ({
        x: W * (0.25 + 0.25 * j), y: lerp(yLevel[2], yLevel[4], [0.25, 0.8, 0.45][j]), vx: 0, vy: 0,
        level: null, placed: 0, pending: false, held: false, holdY: 0,
        s: 0, sv: 0, ux: 0, uy: -1, amp: CFG.quiet,
        th: rand() * TAU, p1: rand() * TAU, p2: rand() * TAU, p3: rand() * TAU, ws: 0.8 + 0.5 * rand(), ws2: 0.8 + 0.5 * rand(), ph: rand() * TAU,
        t0: 0, bpm: 41, gap: 0.4
      }));
      dragging = null; samples = [];
      for (const r of radioBox.querySelectorAll('input')) r.checked = false;
      showTitle(); dirty = true;
    }
    const firstUnset = () => blobs.findIndex(b => !b.placed);
    const nearestLevel = y => { let best = 1, d = 1e9; for (let l = 1; l <= 5; l++) { const k = Math.abs(y - yLevel[l]); if (k < d) { d = k; best = l; } } return best; };

    // The sentence at the top. Phrases go in lane order. "but" is used once, where the news first flips between good and bad;
    // later flips get ", and". When focus and thinking are both normal they share one clause.
    /*compose:start*/
    function compose(levels, cap = true) {
      const cl = [];
      levels.forEach((lv, j) => { if (lv) cl.push({ t: LANES[j].words[lv - 1].t, good: LANES[j].words[lv - 1].good, j }); });
      if (levels[1] === 3 && levels[2] === 3) cl.splice(cl.findIndex(c => c.j === 1), 2, { t: 'focus and thinking are normal', good: 1, merged: true, j: 1 });
      let out = '', but = false, prev = '';
      cl.forEach((c, i) => {
        if (!i) { out = c.t; return; }
        const flip = c.good !== cl[i - 1].good, last = i === cl.length - 1;
        let join;
        if (flip && !but) { join = ' but'; but = true; }
        else if (flip) join = ', and';
        else if (last && !c.merged && prev !== ', and') join = ' and';
        else join = ',';
        out += join + ' ' + c.t; prev = join;
      });
      return cap ? out.charAt(0).toUpperCase() + out.slice(1) : out;
    }
    /*compose:end*/
    const sentence = () => compose(blobs.map(b => b.placed));
    let shown = '__';
    function showTitle() {
      const text = sentence();
      if (text === shown) return;
      shown = text; titleEl.textContent = text;
      const all = blobs.every(b => b.placed);
      next.classList.toggle('on', all); next.setAttribute('aria-disabled', all ? 'false' : 'true');
      window.moodPad = all ? { tension: blobs[0].placed, focus: blobs[1].placed, speed: blobs[2].placed } : null;
    }
    // The heartbeat of a placed blob: a full thump, then a softer one. Level 1 beats slowly, level 5 quickly.
    const thump = (t, a) => { if (t <= 0) return 0; const q = t / a; return q * q * Math.exp(2 * (1 - q)); };
    function beat(b, now) {
      const per = 60 / b.bpm, age = (((now - b.t0) % per) + per) % per;
      const one = a => thump(a, CFG.lubRise) + CFG.dub * thump(a - b.gap, CFG.dubRise);
      return one(age) + one(age + per); // the tail of the last beat is still fading
    }
    function land(j) {
      const b = blobs[j]; b.pending = false; b.placed = b.level;
      const e = (b.level - 1) / 4; b.bpm = CFG.lowBpm * Math.pow(CFG.highBpm / CFG.lowBpm, e); b.gap = lerp(CFG.gapSlow, CFG.gapFast, e); b.t0 = hs.now;
      b.sv -= 1.2; // a little thump as it lands
      showTitle();
      buzz(b.level === 5 || b.level === 1 ? 14 : 8);
      const radio = radioBox.querySelector(`input[name=lane${j}][value="${b.level}"]`); if (radio) radio.checked = true;
    }
    function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {} }
    function sendTo(j, level, kick) {
      const b = blobs[j]; b.level = level; b.pending = true; b.held = false; b.side = Math.sign(b.y - yLevel[level]);
      if (kick) { b.vx = kick.vx; b.vy = kick.vy; }
      if (motion.matches) { b.x = laneX[j]; b.y = yLevel[level]; b.vx = b.vy = 0; land(j); }
      dirty = true; wake();
    }

    function step(now) {
      if (hs.last === null) hs.last = now;
      const dt = clamp(now - hs.last, 0, 0.05); hs.last = now; hs.dt = dt; hs.now = now;
      hs.dc += dt * CFG.driftSpeed;
      const still = motion.matches, n = Math.max(1, Math.ceil(dt * 120)), h = dt / n, act = firstUnset();
      moving = 0;
      const mid = (yLevel[1] + yLevel[5]) / 2, span = yLevel[1] - yLevel[5];
      for (let j = 0; j < 3; j++) {
        const b = blobs[j], tx = laneX[j];

        else blobs.forEach((b, j) => { if (b.level != null) { b.x = laneX[j]; b.y = yLevel[b.level]; b.vx = b.vy = 0; } b.holdY = b.y; });
        if (testClock) render(clock());
      });
    }
    if (vv) vv.addEventListener('resize', fit);
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', () => setTimeout(fit, 250));
    const params = new URLSearchParams(location.search);
    if (params.has('pu')) setColour(+params.get('pu'), +params.get('e') || 0.5); else setColour(0.8, 0.8);
    if (window.__FLOW) { pad.classList.add('off'); paused = true; }
    const go = () => { fit(); wake(); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  })();
  </script>
</body>
</html>
